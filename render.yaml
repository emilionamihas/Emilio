databases:
  - name: ascend-connect-db
    plan: free
    databaseName: ascend_connect
    user: ascend_connect

services:
  - type: web
    name: ascend-connect
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: ascend-connect-db
          property: connectionString
      - key: ADMIN_PASSPHRASE
        generateValue: true
