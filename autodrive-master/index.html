    alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
    bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    left: '<path d="m15 18-6-6 6-6"/>',
    right: '<path d="m9 18 6-6-6-6"/>',
    down: '<path d="m6 9 6 6 6-6"/>',
    arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    rotate: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
    trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
    flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
    book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
    road: '<path d="M4 22 9 2"/><path d="m20 22-5-20"/><path d="M12 6v2"/><path d="M12 12v2"/><path d="M12 18v2"/>'
  };
  function Icon({ name, className = 'w-5 h-5' }) {
    return html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true" dangerouslySetInnerHTML=${{ __html: ICONS[name] }}></svg>`;
  }
  function Sign({ k, label, className = 'w-24 h-24' }) {
    const svg = `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${(label || 'Señal de tránsito').replace(/"/g, '')}" style="width:100%;height:100%;overflow:visible">${SIGN_SVG[k] || ''}</svg>`;
    return html`<div className=${className} dangerouslySetInnerHTML=${{ __html: svg }}></div>`;
  }
  const signLabel = (q) => { const s = REGION_BY_ID[q.region].signById[q.sign]; return s ? 'Señal: ' + s.name : 'Señal de tránsito'; };

  /* ───────── Progreso ───────── */
  const EMPTY_R = { q: {}, errors: [], exams: [], signs: [] };
  const DEFAULT = { region: 'pe', days: [], r: {} };
  function loadState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const s = JSON.parse(raw); return { ...DEFAULT, ...s, r: s.r || {} }; }
    } catch (e) { /* almacenamiento no disponible */ }
    return { ...DEFAULT };
  }
  const slice = (state, rid) => ({ ...EMPTY_R, ...(state.r[rid] || {}) });
  const withSlice = (s, rid, fn) => ({ ...s, r: { ...s.r, [rid]: fn(slice(s, rid)) } });
  function applyAnswer(s, rid, id, ok, review) {
    const t = today();
    const days = s.days.includes(t) ? s.days : [...s.days, t].slice(-400);
    return withSlice({ ...s, days }, rid, (r) => {
      const prev = r.q[id] || { seen: 0, correct: 0, last: null };
      const q = { ...r.q, [id]: { seen: prev.seen + 1, correct: prev.correct + (ok ? 1 : 0), last: ok } };
      let errors = r.errors;
      if (!ok && !errors.includes(id)) errors = [...errors, id];
      if (ok && review) errors = errors.filter((e) => e !== id);
      return { ...r, q, errors };
    });
  }
  // Una pregunta vale 1 si la acertaste 2+ veces y la última fue correcta; 0,7 si solo la acertaste una vez.
  const qScore = (st) => (st && st.last ? (st.correct >= 2 ? 1 : 0.7) : 0);
  function readiness(rs, ids) {
    if (!ids.length) return 0;
    return Math.round((ids.reduce((a, id) => a + qScore(rs.q[id]), 0) / ids.length) * 100);
  }
  function streakInfo(days) {
    const set = new Set(days);
    const d = new Date();
    const todayDone = set.has(dayKey(d));
    if (!todayDone) d.setDate(d.getDate() - 1);
    let n = 0;
    while (set.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return { n, todayDone };
  }

  /* ───────── Piezas comunes ───────── */
  function useCountUp(target, dur = 1200) {
    const [v, setV] = useState(0);
    useEffect(() => {
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { setV(target); return; }
      let raf; const t0 = performance.now();
      const step = (t) => {
        const p = Math.min(1, (t - t0) / dur);
        setV(Math.round(target * (1 - Math.pow(1 - p, 3))));
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
      return () => cancelAnimationFrame(raf);
    }, [target]);
    return v;
  }

  function Ring({ value, size = 184, stroke = 13, id, colors = ['#10b981', '#6366f1'], children }) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;
    const [v, setV] = useState(0);
    useEffect(() => { const t = setTimeout(() => setV(value), 80); return () => clearTimeout(t); }, [value]);
    const shown = useCountUp(value);
    return html`<div className="relative shrink-0" style=${{ width: size, height: size, maxWidth: '100%' }}>
      <svg width=${size} height=${size} viewBox=${'0 0 ' + size + ' ' + size} style=${{ transform: 'rotate(-90deg)' }} aria-hidden="true">
        <defs><linearGradient id=${id} x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor=${colors[0]}></stop><stop offset="100%" stopColor=${colors[1]}></stop></linearGradient></defs>
        <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth=${stroke}></circle>
        <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${'url(#' + id + ')'} strokeWidth=${stroke} strokeLinecap="round"
          strokeDasharray=${c} strokeDashoffset=${c * (1 - v / 100)} style=${{ transition: 'stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)' }}></circle>
      </svg>
      <div className="absolute inset-0 grid place-items-center text-center">${children(shown)}</div>
    </div>`;
  }

  function Chip({ className, children }) {
    return html`<span className=${cx('inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] font-semibold uppercase tracking-[0.08em]', className)}>${children}</span>`;
  }
  const CatChip = ({ cat }) => html`<${Chip} className=${CATS[cat].chip}>${CATS[cat].label}<//>`;
  const CodeBadge = ({ code, className }) => html`<span className=${cx('grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-gradient-to-br from-emerald-400/25 to-indigo-500/30 font-display text-sm font-bold tracking-wider text-white ring-1 ring-white/10', className)}>${code}</span>`;

  function Btn({ variant = 'primary', className, children, ...rest }) {
    const styles = {
      primary: 'bg-indigo-500 hover:bg-indigo-400 text-white shadow-lg shadow-indigo-500/25',
      emerald: 'bg-emerald-500 hover:bg-emerald-400 text-emerald-950 shadow-lg shadow-emerald-500/20',
      coral: 'bg-rose-500 hover:bg-rose-400 text-white shadow-lg shadow-rose-500/20',
      ghost: 'border border-white/10 bg-white/[0.04] hover:bg-white/[0.08] hover:border-white/20 text-slate-200'
    };
    return html`<button type="button" ...${rest} className=${cx('inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition duration-200 active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none', styles[variant], className)}>${children}</button>`;
  }
  function Eyebrow({ children, className }) {
    return html`<p className=${cx('text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-400', className)}>${children}</p>`;
  }
  function ProgressBar({ value, className, color = 'from-emerald-400 to-indigo-400' }) {
    return html`<div className=${cx('h-1.5 w-full overflow-hidden rounded-full bg-white/[0.07]', className)}>
      <div className=${cx('bar-fill h-full rounded-full bg-gradient-to-r', color)} style=${{ width: Math.max(0, Math.min(100, value)) + '%' }}></div>
    </div>`;
  }

  /* ───────── Pregunta y explicación ───────── */
  function Explanation({ q, chosen }) {
    const ok = chosen === q.answer;
    const letters = q.tf ? TF : LET;
    const tone = ok ? 'border-emerald-400/25 bg-emerald-500/[0.07]' : 'border-rose-400/25 bg-rose-500/[0.07]';
    return html`<div className=${cx('reveal mt-5 rounded-xl border p-5', tone)} role="status">
      <div className=${cx('flex items-center gap-2 font-display text-xl font-semibold', ok ? 'text-emerald-300' : 'text-rose-300')}>
        <${Icon} name=${ok ? 'check' : 'x'} className="w-5 h-5" />
        ${ok ? 'Correcto' : chosen == null ? 'Sin responder' : 'Incorrecto'}
      </div>
      ${!ok && html`<p className="mt-1 text-sm text-slate-300">Respuesta correcta: <strong className="text-slate-100">${q.tf ? q.opts[q.answer] : letters[q.answer] + '. ' + q.opts[q.answer]}</strong></p>`}
      <p className="mt-3 max-w-[65ch] leading-relaxed text-slate-200">${q.exp}</p>
      ${q.tip && html`<div className="mt-4 flex gap-3 rounded-lg bg-white/[0.04] px-4 py-3 text-sm text-slate-200">
        <${Icon} name="bulb" className="w-5 h-5 shrink-0 text-amber-300" />
        <span><span className="block text-[11px] font-semibold uppercase tracking-[0.12em] text-amber-300/90">Para recordar</span>${q.tip}</span>
      </div>`}
    </div>`;
  }

  function QuestionCard({ q, chosen, onChoose, mode, reveal, header }) {
    const letters = q.tf ? TF : LET;
    return html`<article className="glass reveal p-5 sm:p-7">
      ${header}
      <div className="flex flex-col gap-5 sm:flex-row sm:items-start">
        ${q.sign && html`<div className="self-center rounded-2xl bg-white/[0.04] p-3 sm:self-start"><${Sign} k=${q.sign} label=${signLabel(q)} className="w-24 h-24 sm:w-28 sm:h-28" /></div>`}
        <div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-center gap-2">
            <${CatChip} cat=${q.cat} />
            ${q.tf && html`<${Chip} className="border-white/15 bg-white/[0.05] text-slate-300">Verdadero o falso<//>`}
          </div>
          <h2 className="mt-3 font-display text-[24px] font-semibold leading-[1.18] text-white sm:text-[28px] text-balance">${q.q}</h2>
        </div>
      </div>
      <div className=${cx('mt-6 grid gap-2.5', q.tf && 'grid-cols-2')}>
        ${q.opts.map((o, i) => {
          const isChosen = chosen === i, isRight = i === q.answer;
          let tone = 'border-white/10 bg-white/[0.025] hover:border-white/25 hover:bg-white/[0.06]';
          let badge = 'bg-white/[0.06] text-slate-300 group-hover:bg-white/[0.12]';
          let mark = letters[i];
          if (mode === 'exam' && isChosen) { tone = 'border-indigo-400/70 bg-indigo-500/15 ring-1 ring-indigo-400/40'; badge = 'bg-indigo-500 text-white'; }
          if (reveal) {
            if (isRight) { tone = 'border-emerald-400/70 bg-emerald-500/15' + (isChosen ? ' pop' : ''); badge = 'bg-emerald-500 text-emerald-950'; mark = html`<${Icon} name="check" className="w-4 h-4" />`; }
            else if (isChosen) { tone = 'border-rose-400/70 bg-rose-500/15 shake'; badge = 'bg-rose-500 text-white'; mark = html`<${Icon} name="x" className="w-4 h-4" />`; }
            else { tone = 'border-white/5 bg-transparent opacity-50'; }
          }
          return html`<button key=${i} type="button" disabled=${reveal} onClick=${() => onChoose(i)} aria-pressed=${isChosen}
            className=${cx('group flex w-full items-start gap-4 rounded-xl border px-4 py-3.5 text-left transition duration-200 disabled:cursor-default', tone)}>
            <span className=${cx('grid h-8 w-8 shrink-0 place-items-center rounded-lg text-sm font-bold transition', badge)}>${mark}</span>
            <span className="min-w-0 pt-1 leading-snug text-slate-100">${o}</span>
          </button>`;
        })}
      </div>
      ${reveal && html`<${Explanation} q=${q} chosen=${chosen} />`}
    </article>`;
  }

  /* ───────── Práctica (también para el banco de errores) ───────── */
  function PracticeRunner({ ids, review, onAnswer, onExit, title }) {
    const [order, setOrder] = useState(ids);
    const [idx, setIdx] = useState(0);
    const [chosen, setChosen] = useState(null);
    const [score, setScore] = useState({ ok: 0, n: 0 });
    const [done, setDone] = useState(false);
    const q = Q_BY_ID[order[idx]];

    const choose = useCallback((i) => {
      if (chosen != null || done) return;
      setChosen(i);
      const ok = i === q.answer;
      onAnswer(q.region, q.id, ok, review);
      setScore((s) => ({ ok: s.ok + (ok ? 1 : 0), n: s.n + 1 }));
    }, [chosen, done, q, review, onAnswer]);
    const next = useCallback(() => {
      if (chosen == null) return;
      if (idx + 1 >= order.length) setDone(true);
      else { setIdx(idx + 1); setChosen(null); }
    }, [chosen, idx, order.length]);
    const restart = () => { setOrder(shuffle(ids)); setIdx(0); setChosen(null); setScore({ ok: 0, n: 0 }); setDone(false); };

    useEffect(() => {
      const onKey = (e) => {
        if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
        const k = e.key.toLowerCase();
        const map = q.tf ? { '1': 0, '2': 1, v: 0, f: 1 } : { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 };
        if (k in map && map[k] < q.opts.length) choose(map[k]);
        else if (k === 'enter' && chosen != null) { e.preventDefault(); next(); }
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [choose, next, chosen, q]);

    if (done) {
      const p = Math.round((score.ok / Math.max(1, score.n)) * 100);
      return html`<div className="glass reveal p-6 text-center sm:p-10">
        <div className="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-emerald-500/15 text-emerald-300"><${Icon} name="trophy" className="w-7 h-7" /></div>
        <${Eyebrow}>${title}<//>
        <h2 className="mt-2 font-display text-4xl font-semibold text-white">Ronda terminada</h2>
        <p className="mt-2 text-slate-300"><span className="tnum font-semibold text-white">${score.ok} de ${score.n}</span> correctas (${p} %).${review ? ' Las que acertaste salieron del banco de errores.' : ''}</p>
        <div className="mt-6 flex flex-wrap justify-center gap-3">
          <${Btn} variant="emerald" onClick=${restart}><${Icon} name="rotate" className="w-4 h-4" />Otra ronda<//>
          <${Btn} variant="ghost" onClick=${onExit}>Salir<//>
        </div>
      </div>`;
    }

    const header = html`<div className="mb-5 flex items-center justify-between gap-3">
      <div className="min-w-0">
        <${Eyebrow}>${title}<//>
        <p className="tnum mt-1 text-sm text-slate-300">Pregunta <span className="font-semibold text-white">${idx + 1}</span> de ${order.length} · <span className="text-emerald-300">${score.ok} correctas</span></p>
      </div>
      <${Btn} variant="ghost" className="!px-3" onClick=${onExit} aria-label="Salir de la práctica"><${Icon} name="x" className="w-4 h-4" /><span className="hidden sm:inline">Salir</span><//>
    </div>
    <${ProgressBar} value=${((idx + (chosen != null ? 1 : 0)) / order.length) * 100} className="mb-6" />`;

    return html`<div>
      <${QuestionCard} key=${q.id + '-' + idx} q=${q} chosen=${chosen} onChoose=${choose} mode="practice" reveal=${chosen != null} header=${header} />
      <div className="mt-4 flex items-center justify-between gap-3">
        <p className="hidden text-xs text-slate-500 sm:block">Atajos: ${q.tf ? 'V o F' : '1–4 o A–D'} para responder, Enter para seguir.</p>
        <${Btn} className="ml-auto" disabled=${chosen == null} onClick=${next}>${idx + 1 >= order.length ? 'Ver resultado' : 'Siguiente'}<${Icon} name="arrow" className="w-4 h-4" /><//>
      </div>
    </div>`;
  }

  function PracticeView({ region, rs, onAnswer }) {
    const [cat, setCat] = useState('all');
    const [weakFirst, setWeakFirst] = useState(true);
    const [session, setSession] = useState(null);
    useEffect(() => { setCat('all'); setSession(null); }, [region.id]);

    if (session) return html`<${PracticeRunner} key=${session.key} ids=${session.ids} review=${false} onAnswer=${onAnswer} onExit=${() => setSession(null)} title=${session.title} />`;

    const pool = region.questions.filter((q) => cat === 'all' || q.cat === cat);
    const start = () => {
      let ids = shuffle(pool.map((q) => q.id));
      if (weakFirst) ids = ids.sort((a, b) => qScore(rs.q[a]) - qScore(rs.q[b]));
      setSession({ ids, key: Date.now(), title: region.name + ' · ' + (cat === 'all' ? 'Todas las categorías' : CATS[cat].label) });
    };
    const options = [['all', 'Todas', region.ids.length, readiness(rs, region.ids)], ...regionCats(region).map((k) => {
      const ids = region.questions.filter((q) => q.cat === k).map((q) => q.id);
      return [k, CATS[k].label, ids.length, readiness(rs, ids)];
    })];

    return html`<div className="grid gap-5 [&>*]:min-w-0">
      <header>
        <${Eyebrow}>Modo práctica · ${region.name}<//>
        <h1 className="mt-1 font-display text-4xl font-semibold text-white sm:text-5xl">Aprende pregunta a pregunta</h1>
        <p className="mt-2 max-w-[60ch] text-slate-300">Ves la respuesta y la explicación en cuanto eliges. Sin reloj: aquí se trata de entender el porqué de cada regla de ${region.country}.</p>
      </header>
      <section className="glass p-5 sm:p-6">
        <${Eyebrow}>Elige un tema<//>
        <div className="mt-4 grid gap-2.5 sm:grid-cols-2 lg:grid-cols-3">
          ${options.map(([k, label, n, p]) => html`<button key=${k} type="button" onClick=${() => setCat(k)} aria-pressed=${cat === k}
            className=${cx('rounded-xl border p-4 text-left transition', cat === k ? 'border-emerald-400/60 bg-emerald-500/10 ring-1 ring-emerald-400/30' : 'border-white/10 bg-white/[0.02] hover:border-white/25')}>
            <div className="flex items-baseline justify-between gap-2"><span className="font-semibold text-white">${label}</span><span className="tnum shrink-0 text-xs text-slate-400">${n} preg.</span></div>
            <${ProgressBar} value=${p} className="mt-3" />
            <p className="tnum mt-2 text-xs text-slate-400">${p} % dominado</p>
          </button>`)}
        </div>
        <div className="mt-5 flex flex-col gap-4 border-t border-white/10 pt-5 sm:flex-row sm:items-center sm:justify-between">
          <label htmlFor="weak-first" className="flex cursor-pointer items-center gap-3 text-sm text-slate-300">
            <input id="weak-first" type="checkbox" checked=${weakFirst} onChange=${(e) => setWeakFirst(e.target.checked)} className="h-4 w-4 accent-emerald-500" />
            Empezar por las que menos domino
          </label>
          <${Btn} variant="emerald" onClick=${start}>Empezar práctica (${pool.length})<${Icon} name="arrow" className="w-4 h-4" /><//>
        </div>
      </section>
    </div>`;
  }

  /* ───────── Simulacro ───────── */
  function ExamRunner({ exam, setExam, onFinish, now }) {
    const [confirm, setConfirm] = useState(false);
    const q = Q_BY_ID[exam.ids[exam.cur]];
    const left = Math.max(0, exam.start + exam.duration - now);
    const answered = Object.keys(exam.answers).length;
    const unanswered = exam.ids.length - answered;
    const marked = exam.marks.includes(exam.cur);
    const low = left < 2 * 60 * 1000;
    const region = REGION_BY_ID[exam.region];

    const setCur = (i) => { setConfirm(false); setExam((e) => ({ ...e, cur: Math.max(0, Math.min(e.ids.length - 1, i)) })); };
    const choose = (i) => setExam((e) => ({ ...e, answers: { ...e.answers, [e.cur]: i } }));
    const toggleMark = () => setExam((e) => ({ ...e, marks: e.marks.includes(e.cur) ? e.marks.filter((m) => m !== e.cur) : [...e.marks, e.cur] }));
    const finish = () => { if (unanswered > 0 && !confirm) setConfirm(true); else onFinish(exam); };

    return html`<div className="grid gap-4">
      <div className="glass flex flex-wrap items-center gap-3 p-3 sm:p-4">
        <div className="min-w-0 flex-1">
          <${Eyebrow}>Simulacro · ${region.name}<//>
          <p className="tnum mt-0.5 text-sm text-slate-300"><span className="font-semibold text-white">${answered}</span> de ${exam.ids.length} respondidas</p>
        </div>
        <div className=${cx('tnum flex items-center gap-2 rounded-xl border px-3 py-2 font-mono text-lg font-bold', low ? 'border-rose-400/50 bg-rose-500/15 text-rose-300' : 'border-white/10 bg-white/[0.04] text-white')} aria-label=${'Tiempo restante ' + fmtTime(left)}>
          <${Icon} name="clock" className="w-4 h-4" />${fmtTime(left)}
        </div>
        <${Btn} variant="coral" onClick=${finish}><${Icon} name="flag" className="w-4 h-4" />Terminar<//>
      </div>

      ${confirm && html`<div className="reveal glass flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between" role="alertdialog" aria-label="Confirmar fin del simulacro">
        <p className="text-sm text-slate-200">Te quedan <strong className="text-white">${unanswered} sin responder</strong>. Contarán como incorrectas.</p>
        <div className="flex gap-2"><${Btn} variant="ghost" onClick=${() => setConfirm(false)}>Seguir respondiendo<//><${Btn} variant="coral" onClick=${() => onFinish(exam)}>Terminar igual<//></div>
      </div>`}

      <${QuestionCard} key=${'exam-' + exam.cur} q=${q} chosen=${exam.answers[exam.cur]} onChoose=${choose} mode="exam" reveal=${false}
        header=${html`<div className="mb-5 flex items-center justify-between gap-3">
          <p className="tnum font-display text-xl font-semibold text-slate-300">Pregunta <span className="text-white">${exam.cur + 1}</span><span className="text-slate-500"> / ${exam.ids.length}</span></p>
          <${Btn} variant="ghost" onClick=${toggleMark} aria-pressed=${marked} className=${cx('!px-3', marked && '!border-amber-400/50 !bg-amber-500/15 !text-amber-200')}>
            <${Icon} name="bookmark" className=${cx('w-4 h-4', marked && 'fill-amber-300')} />${marked ? 'Marcada' : 'Marcar'}
          <//>
        </div>`} />

      <div className="flex items-center justify-between gap-3">
        <${Btn} variant="ghost" disabled=${exam.cur === 0} onClick=${() => setCur(exam.cur - 1)}><${Icon} name="left" className="w-4 h-4" />Anterior<//>
        ${exam.cur + 1 < exam.ids.length
          ? html`<${Btn} onClick=${() => setCur(exam.cur + 1)}>Siguiente<${Icon} name="right" className="w-4 h-4" /><//>`
          : html`<${Btn} variant="coral" onClick=${finish}>Terminar simulacro<${Icon} name="flag" className="w-4 h-4" /><//>`}
      </div>

      <section className="glass p-4 sm:p-5">
        <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
          <${Eyebrow}>Mapa del examen<//>
          <div className="flex flex-wrap gap-3 text-xs text-slate-400">
            <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded bg-indigo-500"></span>Respondida</span>
            <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded bg-amber-400"></span>Marcada</span>
            <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded border border-white/25"></span>Pendiente</span>
          </div>
        </div>
        <div className="grid grid-cols-6 gap-1.5 min-[420px]:grid-cols-8 sm:grid-cols-10">
          ${exam.ids.map((id, i) => {
            const a = exam.answers[i] != null, m = exam.marks.includes(i), cur = i === exam.cur;
            return html`<button key=${id} type="button" onClick=${() => setCur(i)} aria-label=${'Ir a la pregunta ' + (i + 1)} aria-current=${cur ? 'step' : undefined}
              className=${cx('tnum relative h-10 rounded-lg text-sm font-semibold transition',
                a ? 'bg-indigo-500/80 text-white hover:bg-indigo-500' : 'border border-white/15 text-slate-400 hover:border-white/35 hover:text-white',
                cur && 'ring-2 ring-white/80 ring-offset-2 ring-offset-[#0b0f19]')}>
              ${i + 1}
              ${m && html`<span className="absolute -right-1 -top-1 h-3 w-3 rounded-full border-2 border-[#0b0f19] bg-amber-400"></span>`}
            </button>`;
          })}
        </div>
      </section>
    </div>`;
  }

  function ExamResults({ exam, onNew, onClose, goErrors }) {
    const [filter, setFilter] = useState(exam.passed ? 'all' : 'wrong');
    const [open, setOpen] = useState({});
    const region = REGION_BY_ID[exam.region];
    const n = exam.res.length;
    const p = Math.round((exam.score / n) * 100);
    const wrong = exam.res.filter((r) => !r.ok).length;
    const markedN = exam.res.filter((r) => r.marked).length;
    const need = needed(n, region.exam.pass);
    const list = exam.res.map((r, i) => ({ ...r, i })).filter((r) => filter === 'all' || (filter === 'wrong' && !r.ok) || (filter === 'marked' && r.marked));
    const byCat = Object.keys(CATS).map((k) => {
      const rs = exam.res.filter((r) => Q_BY_ID[r.id].cat === k);
      return { k, n: rs.length, ok: rs.filter((r) => r.ok).length };
    }).filter((c) => c.n > 0);

    return html`<div className="grid gap-5 [&>*]:min-w-0">
      <section className="glass reveal flex flex-col items-center gap-6 p-6 sm:flex-row sm:p-8">
        <${Ring} value=${p} id="ring-result" colors=${exam.passed ? ['#10b981', '#6366f1'] : ['#f43f5e', '#f59e0b']}>
          ${(v) => html`<div><div className="tnum font-display text-5xl font-bold text-white">${v}<span className="text-2xl text-slate-400">%</span></div><div className="tnum text-sm text-slate-400">${exam.score} / ${n}</div></div>`}
        <//>
        <div className="min-w-0 flex-1 text-center sm:text-left">
          <div className="flex flex-wrap justify-center gap-2 sm:justify-start">
            <${Chip} className=${exam.passed ? 'bg-emerald-500/15 text-emerald-300 border-emerald-400/30' : 'bg-rose-500/15 text-rose-300 border-rose-400/30'}>
              <${Icon} name=${exam.passed ? 'check' : 'x'} className="w-3.5 h-3.5" />${exam.passed ? 'Aprobado' : 'Reprobado'}
            <//>
            <${Chip} className="border-white/15 bg-white/[0.05] text-slate-300">${region.name} · ${region.country}<//>
          </div>
          <h1 className="mt-3 font-display text-4xl font-semibold text-white sm:text-5xl text-balance">${exam.passed ? 'Nivel de examen real' : exam.score >= need - 3 ? 'Te faltó muy poco' : 'Todavía no: repasa los errores'}</h1>
          <p className="mt-2 max-w-[55ch] text-slate-300">Necesitabas <strong className="text-white">${need} de ${n}</strong> (${pct(region.exam.pass)} %), como en el examen oficial. ${exam.passed ? 'Repasa igual lo que fallaste: el examen real elige otras preguntas.' : 'Abajo tienes cada error con su explicación.'}</p>
          <div className="tnum mt-4 flex flex-wrap justify-center gap-x-6 gap-y-2 text-sm text-slate-400 sm:justify-start">
            <span className="flex items-center gap-1.5"><${Icon} name="clock" className="w-4 h-4" />${fmtTime(exam.used)} de ${fmtTime(exam.duration)}</span>
            <span className="flex items-center gap-1.5 text-rose-300"><${Icon} name="x" className="w-4 h-4" />${wrong} errores</span>
            <span className="flex items-center gap-1.5 text-amber-300"><${Icon} name="bookmark" className="w-4 h-4" />${markedN} marcadas</span>
          </div>
          <div className="mt-5 flex flex-wrap justify-center gap-3 sm:justify-start">
            <${Btn} onClick=${onNew}><${Icon} name="rotate" className="w-4 h-4" />Nuevo simulacro<//>
            ${wrong > 0 && html`<${Btn} variant="ghost" onClick=${goErrors}>Practicar mis errores<//>`}
            <${Btn} variant="ghost" onClick=${onClose}>Cerrar<//>
          </div>
        </div>
      </section>

      <section className="glass p-5 sm:p-6">
        <${Eyebrow}>Desglose por tema<//>
        <div className="mt-4 grid gap-4 sm:grid-cols-2">
          ${byCat.map((c) => html`<div key=${c.k}>
            <div className="flex items-baseline justify-between text-sm"><span className="text-slate-200">${CATS[c.k].label}</span><span className="tnum text-slate-400">${c.ok}/${c.n}</span></div>
            <${ProgressBar} value=${(c.ok / c.n) * 100} className="mt-2" color=${c.ok / c.n >= region.exam.pass ? 'from-emerald-400 to-emerald-300' : 'from-rose-400 to-amber-300'} />
          </div>`)}
        </div>
      </section>

      <section className="grid gap-3">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <h2 className="font-display text-2xl font-semibold text-white">Revisión del examen</h2>
          <div className="flex gap-1 rounded-xl border border-white/10 bg-white/[0.03] p-1" role="tablist" aria-label="Filtrar preguntas">
            ${[['all', 'Todas', n], ['wrong', 'Errores', wrong], ['marked', 'Marcadas', markedN]].map(([k, l, c]) => html`<button key=${k} type="button" role="tab" aria-selected=${filter === k} onClick=${() => setFilter(k)}
              className=${cx('tnum rounded-lg px-3 py-1.5 text-sm font-medium transition', filter === k ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white')}>${l} <span className="text-slate-500">${c}</span></button>`)}
          </div>
        </div>
        ${list.length === 0 && html`<p className="glass p-6 text-center text-slate-400">No hay preguntas en este filtro.</p>`}
        ${list.map((r) => {
          const q = Q_BY_ID[r.id], isOpen = !!open[r.i], letters = q.tf ? TF : LET;
          return html`<article key=${r.id} className="glass overflow-hidden">
            <button type="button" onClick=${() => setOpen((o) => ({ ...o, [r.i]: !o[r.i] }))} aria-expanded=${isOpen}
              className="flex w-full items-start gap-4 p-4 text-left transition hover:bg-white/[0.03] sm:p-5">
              <span className=${cx('grid h-8 w-8 shrink-0 place-items-center rounded-lg', r.ok ? 'bg-emerald-500/15 text-emerald-300' : 'bg-rose-500/15 text-rose-300')}><${Icon} name=${r.ok ? 'check' : 'x'} className="w-4 h-4" /></span>
              <span className="min-w-0 flex-1">
                <span className="tnum block text-xs text-slate-500">Pregunta ${r.i + 1} · ${CATS[q.cat].label}${r.marked ? ' · Marcada' : ''}</span>
                <span className="mt-1 block font-medium leading-snug text-slate-100">${q.q}</span>
                ${!r.ok && html`<span className="mt-1 block text-sm text-rose-300/90">Tu respuesta: ${r.chosen == null ? 'sin responder' : q.tf ? q.opts[r.chosen] : letters[r.chosen] + '. ' + q.opts[r.chosen]}</span>`}
              </span>
              <${Icon} name="right" className=${cx('mt-1 h-4 w-4 shrink-0 text-slate-500 transition', isOpen && 'rotate-90')} />
            </button>
            ${isOpen && html`<div className="border-t border-white/10 px-4 pb-5 sm:px-5">
              <div className="flex flex-col gap-4 pt-4 sm:flex-row">
                ${q.sign && html`<${Sign} k=${q.sign} label=${signLabel(q)} className="h-20 w-20 shrink-0" />`}
                <div className="min-w-0 flex-1"><${Explanation} q=${q} chosen=${r.chosen} /></div>
              </div>
            </div>`}
          </article>`;
        })}
      </section>
    </div>`;
  }

  function ExamView({ region, rs, exam, setExam, startExam, finishExam, now, go }) {
    if (exam && !exam.finished) return html`<${ExamRunner} exam=${exam} setExam=${setExam} onFinish=${finishExam} now=${now} />`;
    if (exam && exam.finished) return html`<${ExamResults} exam=${exam} onNew=${startExam} onClose=${() => setExam(null)} goErrors=${() => go('errores')} />`;
    const ex = region.exam;
    const size = Math.min(ex.size, region.ids.length);
    const history = [...rs.exams].reverse().slice(0, 6);
    return html`<div className="grid gap-5 [&>*]:min-w-0">
      <header>
        <${Eyebrow}>Simulacro de examen teórico · ${region.name}<//>
        <h1 className="mt-1 font-display text-4xl font-semibold text-white sm:text-5xl">Practica en condiciones reales</h1>
        <p className="mt-2 max-w-[62ch] text-slate-300">Como en el examen oficial, no sabrás si acertaste hasta el final. Puedes saltar entre preguntas y marcar las dudosas. Se aprueba con el mismo porcentaje que exige ${region.country}.</p>
      </header>
      <section className="glass p-6 sm:p-8">
        <div className="grid grid-cols-3 gap-3 text-center">
          ${[[size, 'preguntas'], [ex.minutes + ':00', 'minutos'], [needed(size, ex.pass) + '/' + size, 'para aprobar']].map(([v, l]) => html`<div key=${l} className="rounded-xl border border-white/10 bg-white/[0.03] px-2 py-4">
            <div className="tnum font-display text-3xl font-bold text-white sm:text-4xl">${v}</div>
            <div className="mt-1 text-xs uppercase tracking-[0.12em] text-slate-400">${l}</div>
          </div>`)}
        </div>
        <div className="mt-5 rounded-xl border border-white/10 bg-white/[0.02] p-4 text-sm">
          <p className="font-semibold text-slate-200">Formato oficial de referencia</p>
          <p className="mt-1 text-slate-400">${ex.official}</p>
          ${size < (ex.officialSize || 0) && html`<p className="mt-1 text-slate-500">Este simulacro es más corto y el tiempo es proporcional; el porcentaje para aprobar es el mismo.</p>`}
        </div>
        <p className="mt-4 text-sm text-slate-400">Se eligen ${size} al azar entre ${region.ids.length} preguntas. Si se acaba el tiempo, el examen se entrega solo. Lo que falles pasa a tu banco de errores.</p>
        <${Btn} className="mt-6 w-full !py-3 !text-base sm:w-auto" onClick=${startExam}><${Icon} name="clipboard" className="w-5 h-5" />Comenzar simulacro<//>
      </section>
      <section className="glass p-5 sm:p-6">
        <${Eyebrow}>Historial · ${region.name}<//>
        ${history.length === 0
          ? html`<p className="mt-3 text-sm text-slate-400">Todavía no has hecho ningún simulacro de esta región. Aquí verás tu nota, el tiempo y el veredicto de cada intento.</p>`
          : html`<div className="mt-3 overflow-x-auto"><table className="tnum w-full min-w-[420px] text-left text-sm">
              <thead><tr className="text-xs uppercase tracking-[0.1em] text-slate-500"><th className="py-2 font-medium">Fecha</th><th className="py-2 font-medium">Nota</th><th className="py-2 font-medium">Tiempo</th><th className="py-2 font-medium">Resultado</th></tr></thead>
              <tbody>${history.map((h) => html`<tr key=${h.date} className="border-t border-white/5">
                <td className="py-2.5 text-slate-300">${fmtDate(h.date)}</td>
                <td className="py-2.5 font-semibold text-white">${h.score}/${h.total}</td>
                <td className="py-2.5 text-slate-400">${fmtTime(h.used)}</td>
                <td className="py-2.5"><span className=${h.passed ? 'text-emerald-300' : 'text-rose-300'}>${h.passed ? 'Aprobado' : 'Reprobado'}</span></td>
              </tr>`)}</tbody>
            </table></div>`}
      </section>
    </div>`;
  }

  /* ───────── Señales ───────── */
  const TYPE_CHIP = { reg: 'bg-rose-500/15 text-rose-300 border-rose-400/25', prev: 'bg-amber-500/15 text-amber-300 border-amber-400/25', info: 'bg-sky-500/15 text-sky-300 border-sky-400/25' };
  const TYPE_TEXT = { reg: 'text-rose-300', prev: 'text-amber-300', info: 'text-sky-300' };
  function SignCard({ s, typeLabel, learned, onToggleLearned }) {
    const [flipped, setFlipped] = useState(false);
    const toggle = () => setFlipped((f) => !f);
    return html`<div className=${cx('flip', flipped && 'flipped')}>
      <div className="flip-inner" role="button" tabIndex="0" aria-pressed=${flipped} aria-label=${flipped ? s.name + '. Toca para ver la señal' : 'Señal ' + typeLabel.toLowerCase() + '. Toca para ver su significado'}
        onClick=${toggle} onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }}>
        <div className="face front flex flex-col items-center justify-between p-4">
          <div className="flex w-full items-center justify-between gap-2">
            <${Chip} className=${cx(TYPE_CHIP[s.type], '!normal-case !tracking-normal')}>${typeLabel}<//>
            ${learned && html`<span className="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-emerald-500/20 text-emerald-300" title="Aprendida"><${Icon} name="check" className="w-3.5 h-3.5" /></span>`}
          </div>
          <${Sign} k=${s.k} label=${'Señal ' + typeLabel} className="h-32 w-32 drop-shadow-[0_10px_25px_rgba(0,0,0,0.45)] transition-transform duration-300 hover:scale-105" />
          <p className="text-xs text-slate-500">Toca para voltear</p>
        </div>
        <div className="face back flex flex-col p-4 text-left">
          <${Chip} className=${cx(TYPE_CHIP[s.type], 'self-start !normal-case !tracking-normal')}>${typeLabel}<//>
          <h3 className="mt-3 font-display text-2xl font-semibold leading-tight text-white text-balance">${s.name}</h3>
          <div className="mt-2 min-h-0 flex-1 overflow-y-auto pr-1">
            <p className="text-sm leading-relaxed text-slate-300">${s.meaning}</p>
            <p className="mt-2 text-xs leading-relaxed text-amber-200/80">${s.tip}</p>
          </div>
          <button type="button" onClick=${(e) => { e.stopPropagation(); onToggleLearned(s.k); }} onKeyDown=${(e) => e.stopPropagation()}
            className=${cx('mt-3 inline-flex items-center justify-center gap-1.5 rounded-lg border px-3 py-2 text-xs font-semibold transition',
              learned ? 'border-emerald-400/40 bg-emerald-500/15 text-emerald-200' : 'border-white/15 text-slate-300 hover:border-white/30 hover:text-white')}>
            <${Icon} name="check" className="w-3.5 h-3.5" />${learned ? 'Aprendida' : 'Marcar como aprendida'}
          </button>
        </div>
      </div>
    </div>`;
  }

  function SignsView({ region, rs, toggleLearned }) {
    const [type, setType] = useState('all');
    useEffect(() => setType('all'), [region.id]);
    const list = region.signs.filter((s) => type === 'all' || s.type === type);
    const learned = rs.signs.filter((k) => region.signById[k]).length;
    const total = region.signs.length;
    const tabs = [['all', 'Todas', total], ...['reg', 'prev', 'info'].map((k) => [k, region.signTypes[k], region.signs.filter((s) => s.type === k).length]).filter((t) => t[2] > 0)];
    return html`<div className="grid gap-5 [&>*]:min-w-0">
      <header className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <${Eyebrow}>Flashcards de señales · ${region.name}<//>
          <h1 className="mt-1 font-display text-4xl font-semibold text-white sm:text-5xl">Reconócelas a la primera</h1>
          <p className="mt-2 max-w-[58ch] text-slate-300">Señales con el diseño que se usa en ${region.country}. Intenta decir el nombre y el significado antes de voltear cada tarjeta.</p>
        </div>
        <div className="glass shrink-0 px-4 py-3">
          <p className="tnum text-sm text-slate-300"><span className="font-display text-2xl font-bold text-white">${learned}</span> / ${total} aprendidas</p>
          <${ProgressBar} value=${(learned / total) * 100} className="mt-2 w-40" />
        </div>
      </header>
      <div className="flex flex-wrap gap-2" role="tablist" aria-label="Tipo de señal">
        ${tabs.map(([k, l, n]) => html`<button key=${k} type="button" role="tab" aria-selected=${type === k} onClick=${() => setType(k)}
          className=${cx('tnum rounded-full border px-4 py-2 text-sm font-medium transition', type === k ? 'border-indigo-400/60 bg-indigo-500/20 text-white' : 'border-white/10 bg-white/[0.03] text-slate-400 hover:border-white/25 hover:text-white')}>
          ${l} <span className="text-slate-500">${n}</span></button>`)}
      </div>
      <div className="grid grid-cols-1 gap-4 min-[420px]:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
        ${list.map((s) => html`<${SignCard} key=${region.id + s.k} s=${s} typeLabel=${region.signTypes[s.type]} learned=${rs.signs.includes(s.k)} onToggleLearned=${toggleLearned} />`)}
      </div>
      <div className="glass grid gap-3 p-5 text-sm text-slate-300 sm:grid-cols-3">
        ${['reg', 'prev', 'info'].map((k) => html`<p key=${k}><strong className=${TYPE_TEXT[k]}>${region.signTypes[k]}.</strong> ${region.signLegend[k]}</p>`)}
      </div>
    </div>`;
  }

  /* ───────── Reglas clave ───────── */
  function RulesView({ region, go }) {
    return html`<div className="grid gap-5 [&>*]:min-w-0">
      <header>
        <${Eyebrow}>Reglas clave · ${region.name}<//>
        <h1 className="mt-1 font-display text-4xl font-semibold text-white sm:text-5xl text-balance">Lo que entra seguro en el examen</h1>
        <p className="mt-2 max-w-[62ch] text-slate-300">Las cifras que más se preguntan en ${region.country}, en una sola página. Apréndelas de memoria y luego ponlas a prueba en el simulacro.</p>
      </header>
      <section className="grid gap-3 sm:grid-cols-3">
        <div className="glass p-5"><${Eyebrow}>Se circula por la<//><p className="mt-2 font-display text-3xl font-bold capitalize text-white">${region.side}</p></div>
        <div className="glass p-5"><${Eyebrow}>Unidades<//><p className="mt-2 font-display text-3xl font-bold text-white">${region.units}</p></div>
        <div className="glass p-5"><${Eyebrow}>Para aprobar<//><p className="tnum mt-2 font-display text-3xl font-bold text-white">${pct(region.exam.pass)} %</p></div>
      </section>
      <section className="glass p-5 sm:p-6">
        <${Eyebrow}>Examen oficial de referencia<//>
        <p className="mt-2 text-slate-200">${region.exam.official}</p>
        <p className="mt-3 text-xs text-slate-500">Fuente: ${region.ref}.</p>
      </section>
      <div className="grid gap-4 md:grid-cols-2">
        ${region.facts.map((f) => html`<section key=${f.title} className="glass p-5 sm:p-6">
          <h2 className="font-display text-2xl font-semibold text-white">${f.title}</h2>
          <dl className="mt-3 divide-y divide-white/5">
            ${f.rows.map(([k, v]) => html`<div key=${k} className="grid grid-cols-1 gap-1 py-2.5 min-[480px]:grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)] min-[480px]:gap-4">
              <dt className="text-sm text-slate-400">${k}</dt>
              <dd className="tnum text-sm font-semibold text-slate-100">${v}</dd>
            </div>`)}
          </dl>
        </section>`)}
      </div>
      <section className="glass flex flex-col gap-4 p-5 sm:flex-row sm:items-center sm:justify-between">
        <p className="max-w-[70ch] text-sm text-slate-400">${region.caveat}</p>
        <${Btn} variant="emerald" className="shrink-0" onClick=${() => go('practica')}>Practicar estas reglas<${Icon} name="arrow" className="w-4 h-4" /><//>
      </section>
    </div>`;
  }

  /* ───────── Banco de errores ───────── */
  function ErrorsView({ region, rs, onAnswer, clearErrors }) {
    const [session, setSession] = useState(null);
    const [confirm, setConfirm] = useState(false);
    useEffect(() => { setSession(null); setConfirm(false); }, [region.id]);
    const ids = rs.errors.filter((id) => Q_BY_ID[id]);

    if (session) return html`<${PracticeRunner} key=${session.key} ids=${session.ids} review=${true} onAnswer=${onAnswer} onExit=${() => setSession(null)} title=${'Repaso de errores · ' + region.name} />`;

    return html`<div className="grid gap-5 [&>*]:min-w-0">
      <header className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <${Eyebrow}>Banco de errores · ${region.name}<//>
          <h1 className="mt-1 font-display text-4xl font-semibold text-white sm:text-5xl">Lo que todavía falla</h1>
          <p className="mt-2 max-w-[60ch] text-slate-300">Cada pregunta que fallas en el simulacro o la práctica se guarda aquí. Sale del banco cuando la aciertas en este repaso.</p>
        </div>
        ${ids.length > 0 && html`<div className="flex shrink-0 flex-wrap gap-2">
          <${Btn} variant="coral" onClick=${() => setSession({ ids: shuffle(ids), key: Date.now() })}><${Icon} name="rotate" className="w-4 h-4" />Repasar todas (${ids.length})<//>
          <${Btn} variant="ghost" onClick=${() => setConfirm(true)} aria-label="Vaciar banco de errores"><${Icon} name="trash" className="w-4 h-4" /><//>
        </div>`}
      </header>
      ${confirm && html`<div className="reveal glass flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between" role="alertdialog" aria-label="Confirmar vaciado">
        <p className="text-sm text-slate-200">¿Vaciar el banco de ${region.name}? Se quitarán ${ids.length} preguntas. Tus estadísticas no cambian.</p>
        <div className="flex gap-2"><${Btn} variant="ghost" onClick=${() => setConfirm(false)}>Cancelar<//><${Btn} variant="coral" onClick=${() => { clearErrors(); setConfirm(false); }}>Vaciar<//></div>
      </div>`}
      ${ids.length === 0
        ? html`<div className="glass p-8 text-center sm:p-12">
            <div className="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-emerald-500/15 text-emerald-300"><${Icon} name="check" className="w-7 h-7" /></div>
            <h2 className="font-display text-3xl font-semibold text-white">Sin errores pendientes</h2>
            <p className="mx-auto mt-2 max-w-[44ch] text-slate-400">Cuando falles una pregunta de ${region.name} en el simulacro o la práctica, aparecerá aquí para que la repases hasta dominarla.</p>
          </div>`
        : html`<div className="grid gap-3">${ids.map((id) => {
            const q = Q_BY_ID[id], st = rs.q[id] || { seen: 0, correct: 0 };
            const fails = st.seen - st.correct;
            return html`<article key=${id} className="glass flex flex-col gap-4 p-4 sm:flex-row sm:items-center sm:p-5">
              ${q.sign && html`<${Sign} k=${q.sign} label=${signLabel(q)} className="hidden h-14 w-14 shrink-0 sm:block" />`}
              <div className="min-w-0 flex-1">
                <div className="flex flex-wrap items-center gap-2"><${CatChip} cat=${q.cat} /><span className="tnum text-xs text-rose-300/80">Fallada ${fails} ${fails === 1 ? 'vez' : 'veces'}</span></div>
                <p className="mt-2 font-medium leading-snug text-slate-100">${q.q}</p>
              </div>
              <${Btn} variant="ghost" className="shrink-0" onClick=${() => setSession({ ids: [id], key: Date.now() })}>Practicar<${Icon} name="arrow" className="w-4 h-4" /><//>
            </article>`;
          })}</div>`}
    </div>`;
  }

  /* ───────── Selector de región ───────── */
  function RegionPicker({ state, current, examRegion, onPick, onClose }) {
    useEffect(() => {
      const f = (e) => { if (e.key === 'Escape') onClose(); };
      window.addEventListener('keydown', f);
      return () => window.removeEventListener('keydown', f);
    }, [onClose]);
    return html`<div className="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm" onClick=${onClose} role="dialog" aria-modal="true" aria-label="Elegir región">
      <div className="shell flex min-h-full items-start justify-center py-8 sm:items-center">
        <div className="reveal w-full max-w-3xl rounded-2xl border border-white/10 bg-[#111726] p-5 shadow-2xl sm:p-7" onClick=${(e) => e.stopPropagation()}>
          <div className="flex items-start justify-between gap-4">

  /* ───────── Dashboard ───────── */
  const DAY_LETTERS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  function Dashboard({ state, region, rs, exam, now, go, onReset, openPicker }) {
    const [confirmReset, setConfirmReset] = useState(false);
    const ready = readiness(rs, region.ids);
    const stats = region.ids.map((id) => rs.q[id]).filter(Boolean);
    const seen = stats.reduce((a, s) => a + s.seen, 0);
    const correct = stats.reduce((a, s) => a + s.correct, 0);
    const accuracy = seen ? Math.round((correct / seen) * 100) : 0;
    const passed = rs.exams.filter((e) => e.passed).length;
    const { n: streak, todayDone } = streakInfo(state.days);
    const daySet = new Set(state.days);
    const week = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return { k: dayKey(d), l: DAY_LETTERS[d.getDay()], today: i === 6 }; });
    const target = Math.round(region.exam.pass * 100);
    const level = ready >= target ? ['Listo para el examen', 'text-emerald-300'] : ready >= 50 ? ['Avanzando bien', 'text-indigo-300'] : ready > 0 ? ['En construcción', 'text-amber-300'] : ['Empieza tu preparación', 'text-slate-300'];
    const lastExams = rs.exams.slice(-10);
    const size = Math.min(region.exam.size, region.ids.length);

    const quick = [
      { id: 'simulacro', icon: 'clipboard', title: 'Simulacro de examen', desc: size + ' preguntas, ' + region.exam.minutes + ' min, aprobar con ' + needed(size, region.exam.pass) + '.', tone: 'bg-indigo-500/15 text-indigo-300', glow: 'hover:border-indigo-400/40' },
      { id: 'practica', icon: 'target', title: 'Modo práctica', desc: 'Respuesta y explicación al instante.', tone: 'bg-emerald-500/15 text-emerald-300', glow: 'hover:border-emerald-400/40' },
      { id: 'senales', icon: 'layers', title: 'Flashcards de señales', desc: region.signs.length + ' señales de ' + region.country + '.', tone: 'bg-rose-500/15 text-rose-300', glow: 'hover:border-rose-400/40' }
    ];

    return html`<div className="grid gap-5 [&>*]:min-w-0">
      <button type="button" onClick=${openPicker} className="glass group flex w-full min-w-0 items-center gap-4 p-4 text-left transition hover:bg-white/[0.06]">
        <${CodeBadge} code=${region.code} className="h-11 w-11 text-base" />
        <span className="min-w-0 flex-1">
          <span className="block text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-400">Estudiando</span>
          <span className="block font-display text-2xl font-semibold leading-tight text-white">${region.name}${region.country !== region.name && html` <span className="text-slate-400">· ${region.country}</span>`}</span>
          <span className="mt-0.5 block truncate text-xs text-slate-500">${region.ref}</span>
        </span>
        <span className="hidden items-center gap-1 text-sm font-semibold text-indigo-300 sm:flex">Cambiar<${Icon} name="down" className="w-4 h-4" /></span>
        <${Icon} name="globe" className="w-5 h-5 text-slate-400 sm:hidden" />
      </button>

      ${exam && !exam.finished && html`<button type="button" onClick=${() => go('simulacro')} className="reveal glass flex items-center gap-4 border-indigo-400/40 p-4 text-left transition hover:bg-white/[0.06]">
        <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-indigo-500/20 text-indigo-300"><${Icon} name="clock" /></span>
        <span className="min-w-0 flex-1"><span className="block font-semibold text-white">Simulacro en curso · ${REGION_BY_ID[exam.region].name}</span><span className="tnum block text-sm text-slate-400">Quedan ${fmtTime(exam.start + exam.duration - now)} · ${Object.keys(exam.answers).length}/${exam.ids.length} respondidas</span></span>
        <${Icon} name="arrow" className="w-5 h-5 text-slate-400" />
      </button>`}

      <section className="grid gap-4 md:grid-cols-3">
        <div className="glass flex flex-col items-center gap-6 p-6 sm:flex-row sm:p-7 md:col-span-2">
          <${Ring} value=${ready} id="ring-ready">
            ${(v) => html`<div><div className="tnum font-display text-6xl font-bold leading-none text-white">${v}<span className="text-3xl text-slate-400">%</span></div><div className="mt-1 text-[11px] uppercase tracking-[0.16em] text-slate-400">preparación</div></div>`}
          <//>
          <div className="min-w-0 flex-1 text-center sm:text-left">
            <${Eyebrow}>Índice de preparación · ${region.name}<//>
            <h1 className=${cx('mt-1 font-display text-4xl font-semibold leading-tight text-balance', level[1])}>${level[0]}</h1>
            <p className="mt-2 text-sm leading-relaxed text-slate-400">Se calcula con tus aciertos sobre las ${region.ids.length} preguntas de esta región. Una pregunta cuenta completa cuando la aciertas dos veces y tu último intento fue correcto. Meta: ${target} %, lo mismo que exige el examen oficial.</p>
            <dl className="tnum mt-5 grid grid-cols-3 gap-2">
              ${[['Respondidas', stats.length + '/' + region.ids.length], ['Precisión', accuracy + ' %'], ['Aprobados', passed + '/' + rs.exams.length]].map(([l, v]) => html`<div key=${l} className="rounded-xl bg-white/[0.04] px-2 py-3 text-center">
                <dd className="font-display text-2xl font-bold text-white">${v}</dd>
                <dt className="mt-0.5 text-[10px] uppercase tracking-[0.12em] text-slate-400">${l}</dt>
              </div>`)}
            </dl>
          </div>
        </div>

        <div className="glass flex flex-col p-6">
          <${Eyebrow}>Racha de estudio<//>
          <div className="mt-3 flex items-center gap-3">
            <span className=${cx('grid h-14 w-14 place-items-center rounded-2xl', streak > 0 ? 'bg-gradient-to-br from-amber-400/25 to-rose-500/25 text-amber-300' : 'bg-white/[0.05] text-slate-500')}>
              <${Icon} name="flame" className=${cx('w-8 h-8', streak > 0 && 'flame')} />
            </span>
            <div><div className="tnum font-display text-5xl font-bold leading-none text-white">${streak}</div><div className="text-sm text-slate-400">${streak === 1 ? 'día seguido' : 'días seguidos'}</div></div>
          </div>
          <div className="mt-5 grid grid-cols-7 gap-1.5">
            ${week.map((d) => html`<div key=${d.k} className="flex flex-col items-center gap-1.5">
              <span className=${cx('h-8 w-full rounded-lg', daySet.has(d.k) ? 'bg-gradient-to-b from-emerald-400 to-emerald-600' : 'bg-white/[0.06]', d.today && 'ring-2 ring-white/40')}></span>
              <span className=${cx('text-[11px]', d.today ? 'font-semibold text-white' : 'text-slate-500')}>${d.l}</span>
            </div>`)}
          </div>
          <p className="mt-4 text-sm text-slate-400">${todayDone ? 'Hoy ya estudiaste. Vuelve mañana para sumar otro día.' : streak > 0 ? 'Responde una pregunta hoy para no perder la racha.' : 'Responde tu primera pregunta para empezar una racha.'}</p>
        </div>
      </section>

      <section className="grid gap-3 sm:grid-cols-3">
        ${quick.map((c) => html`<button key=${c.id} type="button" onClick=${() => go(c.id)} className=${cx('glass group flex flex-col items-start gap-4 p-5 text-left transition duration-300 hover:-translate-y-0.5 hover:bg-white/[0.06]', c.glow)}>
          <span className=${cx('grid h-11 w-11 place-items-center rounded-xl', c.tone)}><${Icon} name=${c.icon} /></span>
          <span className="w-full">
            <span className="flex items-center justify-between gap-2 font-display text-2xl font-semibold text-white">${c.title}<${Icon} name="arrow" className="w-5 h-5 shrink-0 text-slate-500 transition group-hover:translate-x-1 group-hover:text-white" /></span>
            <span className="mt-1 block text-sm text-slate-400">${c.desc}</span>
          </span>
        </button>`)}
      </section>

      <section className="grid gap-4 md:grid-cols-2">
        <div className="glass p-6">
          <${Eyebrow}>Dominio por tema<//>
          <div className="mt-4 grid gap-4">
            ${regionCats(region).map((k) => {
              const ids = region.questions.filter((q) => q.cat === k).map((q) => q.id);
              const p = readiness(rs, ids);
              const mastered = ids.filter((id) => qScore(rs.q[id]) === 1).length;
              return html`<div key=${k}>
                <div className="flex items-baseline justify-between gap-2 text-sm"><span className="text-slate-200">${CATS[k].label}</span><span className="tnum text-slate-400">${p} %</span></div>
                <${ProgressBar} value=${p} className="mt-2" />
                <p className="tnum mt-1 text-xs text-slate-500">${mastered} de ${ids.length} dominadas</p>
              </div>`;
            })}
          </div>
        </div>
        <div className="glass flex flex-col p-6">
          <div className="flex items-center justify-between gap-2">
            <${Eyebrow}>Últimos simulacros<//>
            ${rs.errors.length > 0 && html`<button type="button" onClick=${() => go('errores')} className="tnum flex items-center gap-1.5 rounded-full bg-rose-500/15 px-3 py-1 text-xs font-semibold text-rose-300 hover:bg-rose-500/25"><${Icon} name="alert" className="w-3.5 h-3.5" />${rs.errors.length} por repasar</button>`}
          </div>
          ${lastExams.length === 0
            ? html`<div className="flex flex-1 flex-col items-start justify-center gap-3 py-6">
                <p className="text-sm text-slate-400">Aún no hay simulacros de ${region.name}. Aquí verás la evolución de tus notas frente a la línea de aprobado (${target} %).</p>
                <${Btn} variant="ghost" onClick=${() => go('simulacro')}>Hacer mi primer simulacro<//>
              </div>`
            : html`<div className="relative mt-6 h-40" role="img" aria-label=${'Notas de los últimos ' + lastExams.length + ' simulacros'}>
                <div className="absolute inset-x-0 z-10 border-t border-dashed border-emerald-400/60" style=${{ bottom: region.exam.pass * 100 + '%' }}>
                  <span className="absolute -top-5 right-0 text-[10px] font-semibold uppercase tracking-[0.12em] text-emerald-300/80">Aprobado ${target} %</span>
                </div>
                <div className="absolute inset-0 flex items-end gap-2">
                  ${lastExams.map((e, i) => html`<div key=${e.date} className="flex h-full flex-1 flex-col justify-end" title=${fmtDate(e.date) + ': ' + e.score + '/' + e.total}>
                    <div className=${cx('w-full rounded-t-md', e.passed ? 'bg-gradient-to-t from-emerald-600 to-emerald-400' : 'bg-gradient-to-t from-rose-600 to-rose-400', i === lastExams.length - 1 && 'ring-2 ring-white/50')} style=${{ height: Math.max(4, (e.score / e.total) * 100) + '%' }}></div>
                  </div>`)}
                </div>
              </div>
              <p className="tnum mt-3 text-sm text-slate-400">Último: <span className="font-semibold text-white">${lastExams[lastExams.length - 1].score}/${lastExams[lastExams.length - 1].total}</span> · Mejor: <span className="font-semibold text-white">${Math.max(...rs.exams.map((e) => Math.round((e.score / e.total) * 100)))} %</span></p>`}
        </div>
      </section>

      <section className="glass p-5 sm:p-6">
        <div className="flex items-center justify-between gap-3">
          <${Eyebrow}>Todas las regiones<//>
          <button type="button" onClick=${openPicker} className="text-sm font-semibold text-indigo-300 hover:text-indigo-200">Cambiar región</button>
        </div>
        <div className="mt-4 grid grid-cols-2 gap-x-6 gap-y-3 sm:grid-cols-4 lg:grid-cols-7">
          ${REGIONS.map((r) => { const p = readiness(slice(state, r.id), r.ids); return html`<div key=${r.id} className=${cx('min-w-0', r.id === region.id && 'text-white')}>
            <div className="flex items-baseline justify-between gap-2 text-sm"><span className=${cx('truncate', r.id === region.id ? 'font-semibold text-white' : 'text-slate-300')}>${r.name}</span><span className="tnum text-xs text-slate-500">${p} %</span></div>
            <${ProgressBar} value=${p} className="mt-1.5" />
          </div>`; })}
        </div>
      </section>

      <footer className="flex flex-col gap-3 pt-2 text-xs text-slate-500 sm:flex-row sm:items-center sm:justify-between">
        <p className="max-w-[70ch]">${region.caveat}</p>
        ${confirmReset
          ? html`<span className="flex shrink-0 items-center gap-2"><span className="text-slate-300">¿Borrar el progreso de ${region.name}?</span>
              <button type="button" className="rounded-lg px-2 py-1 text-slate-300 hover:text-white" onClick=${() => setConfirmReset(false)}>Cancelar</button>
              <button type="button" className="rounded-lg bg-rose-500/20 px-2 py-1 font-semibold text-rose-300 hover:bg-rose-500/30" onClick=${() => { onReset(); setConfirmReset(false); }}>Borrar</button></span>`
          : html`<button type="button" className="shrink-0 self-start rounded-lg px-2 py-1 text-slate-500 underline-offset-4 hover:text-slate-300 hover:underline" onClick=${() => setConfirmReset(true)}>Reiniciar progreso de ${region.name}</button>`}
      </footer>
    </div>`;
  }

  /* ───────── App ───────── */
  const TABS = [
    { id: 'inicio', label: 'Inicio', icon: 'home' },
    { id: 'simulacro', label: 'Simulacro', icon: 'clipboard' },
    { id: 'practica', label: 'Práctica', icon: 'target' },
    { id: 'senales', label: 'Señales', icon: 'layers' },
    { id: 'reglas', label: 'Reglas', icon: 'book' },
    { id: 'errores', label: 'Errores', icon: 'alert' }
  ];
  const tabFromHash = () => { const h = (location.hash || '').slice(1); return TABS.some((t) => t.id === h) ? h : 'inicio'; };

  const LOGO = '<svg viewBox="0 0 40 40" aria-hidden="true" style="width:100%;height:100%"><defs><linearGradient id="lg-logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg-logo)"/><path d="M15 33 L18.5 7 M25 33 L21.5 7" stroke="#0b0f19" stroke-width="2.6" stroke-linecap="round" opacity=".85"/><path d="M20 30v-3.5M20 22v-3M20 14.5V12" stroke="#facc15" stroke-width="2.2" stroke-linecap="round"/></svg>';

  function App() {
    const [state, setState] = useState(loadState);
    const [tab, setTab] = useState(tabFromHash);
    const [exam, setExam] = useState(null);
    const [now, setNow] = useState(Date.now());
    const [picker, setPicker] = useState(false);
    const region = REGION_BY_ID[state.region] || REGIONS[0];
    const rs = slice(state, region.id);

    useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* sin almacenamiento */ } }, [state]);
    useEffect(() => { const f = () => setTab(tabFromHash()); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);

    const go = useCallback((id) => {
      setTab(id);
      try { if (location.hash.slice(1) !== id) location.hash = id; } catch (e) { /* ignorar */ }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, []);

    const onAnswer = useCallback((rid, id, ok, review) => setState((s) => applyAnswer(s, rid, id, ok, review)), []);

    const finishExam = useCallback((ex) => {
      if (!ex || ex.finished) return;
      const r = REGION_BY_ID[ex.region];
      const res = ex.ids.map((id, i) => ({ id, chosen: ex.answers[i] ?? null, ok: ex.answers[i] === Q_BY_ID[id].answer, marked: ex.marks.includes(i) }));
      const score = res.filter((x) => x.ok).length;
      const used = Math.min(ex.duration, Date.now() - ex.start);
      const passed = score >= needed(res.length, r.exam.pass);
      setState((s) => {
        let n = s;
        res.forEach((x) => { n = applyAnswer(n, ex.region, x.id, x.ok, false); });
        return withSlice(n, ex.region, (sl) => ({ ...sl, exams: [...sl.exams, { date: Date.now(), score, total: res.length, passed, used }].slice(-30) }));
      });
      setExam({ ...ex, finished: true, res, score, used, passed });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, []);

    const startExam = useCallback(() => {
      const t = Date.now();
      const size = Math.min(region.exam.size, region.ids.length);
      setNow(t);
      setExam({ region: region.id, ids: shuffle(region.ids).slice(0, size), answers: {}, marks: [], cur: 0, start: t, duration: region.exam.minutes * 60 * 1000, finished: false });
      go('simulacro');
    }, [go, region]);

    const examRunning = !!exam && !exam.finished;
    useEffect(() => {
      if (!examRunning) return;
      const t = setInterval(() => setNow(Date.now()), 1000);
      return () => clearInterval(t);
    }, [examRunning]);
    useEffect(() => { if (exam && !exam.finished && now >= exam.start + exam.duration) finishExam(exam); }, [now, exam, finishExam]);

    const pickRegion = useCallback((rid) => {
      setPicker(false);
      setState((s) => ({ ...s, region: rid }));
      setExam((e) => (e && e.region !== rid ? null : e));
    }, []);
    const toggleLearned = useCallback((k) => setState((s) => withSlice(s, s.region, (sl) => ({ ...sl, signs: sl.signs.includes(k) ? sl.signs.filter((x) => x !== k) : [...sl.signs, k] }))), []);
    const clearErrors = useCallback(() => setState((s) => withSlice(s, s.region, (sl) => ({ ...sl, errors: [] }))), []);
    const onReset = useCallback(() => { setState((s) => ({ ...s, r: { ...s.r, [s.region]: { ...EMPTY_R } } })); setExam((e) => (e && e.region === region.id ? null : e)); }, [region.id]);

    const common = { region, rs };
    let view;
    if (tab === 'simulacro') view = html`<${ExamView} ...${common} exam=${exam} setExam=${setExam} startExam=${startExam} finishExam=${finishExam} now=${now} go=${go} />`;
    else if (tab === 'practica') view = html`<${PracticeView} ...${common} onAnswer=${onAnswer} />`;
    else if (tab === 'senales') view = html`<${SignsView} ...${common} toggleLearned=${toggleLearned} />`;
    else if (tab === 'reglas') view = html`<${RulesView} ...${common} go=${go} />`;
    else if (tab === 'errores') view = html`<${ErrorsView} ...${common} onAnswer=${onAnswer} clearErrors=${clearErrors} />`;
    else view = html`<${Dashboard} ...${common} state=${state} exam=${exam} now=${now} go=${go} onReset=${onReset} openPicker=${() => setPicker(true)} />`;

    const badge = (id) => {
      if (id === 'errores' && rs.errors.length) return html`<span className="tnum absolute -right-1 -top-1 grid h-4 min-w-[16px] place-items-center rounded-full bg-rose-500 px-1 text-[10px] font-bold text-white">${rs.errors.length}</span>`;
      if (id === 'simulacro' && examRunning) return html`<span className="absolute -right-0.5 -top-0.5 h-2.5 w-2.5 animate-pulse rounded-full bg-indigo-400"></span>`;
      return null;
    };

    return html`<div className="shell min-h-screen">
      <div className="mx-auto max-w-[1100px] pb-32 pt-5 lg:pb-14 lg:pt-7">
        <header className="mb-2 flex items-center justify-between gap-3">
          <button type="button" onClick=${() => go('inicio')} className="flex min-w-0 items-center gap-3 rounded-xl text-left" aria-label="Ir al inicio">
            <span className="h-10 w-10 shrink-0" dangerouslySetInnerHTML=${{ __html: LOGO }}></span>
            <span className="min-w-0">
              <span className="block truncate font-display text-2xl font-bold leading-none tracking-wide text-white">AutoDrive <span className="text-emerald-400">Master</span></span>
              <span className="mt-1 hidden text-[11px] uppercase tracking-[0.16em] text-slate-500 min-[420px]:block">Examen teórico de manejo</span>
            </span>
          </button>
          <div className="flex items-center gap-2">
            <button type="button" onClick=${() => setPicker(true)} className="glass flex shrink-0 items-center gap-2 !rounded-xl px-2.5 py-1.5 text-sm font-semibold text-white transition hover:bg-white/[0.08]" aria-label=${'Región: ' + region.name + '. Cambiar'}>
              <span className="grid h-6 min-w-[28px] place-items-center rounded-md bg-emerald-500/20 px-1 font-display text-xs font-bold tracking-wider text-emerald-200">${region.code}</span>
              <span className="hidden sm:inline">${region.name}</span>
              <${Icon} name="down" className="w-4 h-4 text-slate-400" />
            </button>
            <nav className="glass hidden items-center gap-1 p-1 lg:flex" aria-label="Secciones">
              ${TABS.map((t) => html`<button key=${t.id} type="button" onClick=${() => go(t.id)} aria-current=${tab === t.id ? 'page' : undefined}
                className=${cx('relative flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium transition', tab === t.id ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white')}>
                <${Icon} name=${t.icon} className="w-4 h-4" />${t.label}${badge(t.id)}
              </button>`)}
            </nav>
          </div>
        </header>
        <div className="lane mb-6 mt-4"></div>
        <main key=${tab + region.id} className="view">${view}</main>
      </div>

      <nav className="bottomnav lg:hidden" aria-label="Secciones">
        <div className="mx-auto grid max-w-lg grid-cols-6 gap-0.5">
          ${TABS.map((t) => html`<button key=${t.id} type="button" onClick=${() => go(t.id)} aria-current=${tab === t.id ? 'page' : undefined}
            className=${cx('flex min-w-0 flex-col items-center gap-1 rounded-xl py-1.5 text-[10.5px] font-medium transition', tab === t.id ? 'text-white' : 'text-slate-500')}>
            <span className=${cx('relative grid h-8 w-11 place-items-center rounded-full transition', tab === t.id && 'bg-indigo-500/25 text-indigo-200')}>
              <${Icon} name=${t.icon} className="w-5 h-5" />${badge(t.id)}
            </span>
            <span className="max-w-full truncate">${t.label}</span>
          </button>`)}
        </div>
      </nav>

      ${picker && html`<${RegionPicker} state=${state} current=${region.id} examRegion=${examRunning ? exam.region : null} onPick=${pickRegion} onClose=${() => setPicker(false)} />`}
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
