  signTypes: { reg: 'Prioridad, prohibición y obligación', prev: 'Peligro', info: 'Indicación' },
  signLegend: { reg: 'Círculo con borde rojo prohíbe; círculo azul obliga. STOP, el triángulo invertido y el rombo amarillo regulan la prioridad.', prev: 'Triángulo con borde rojo, vértice hacia arriba.', info: 'Cuadrados y rectángulos azules. Informan sin obligar.' },
  signs: [
    { k: 'stop', type: 'reg', name: 'STOP', meaning: 'Detención obligatoria y ceder el paso. En España la palabra es STOP, no PARE.', tip: 'Detente en la línea; si no hay línea, donde tengas visibilidad sin invadir el cruce.' },
    { k: 'cedaEU', type: 'reg', name: 'Ceda el paso', meaning: 'Cede el paso a los vehículos de la vía a la que te aproximas. Sin texto en Europa.', tip: 'Triángulo invertido, sin letras.' },
    { k: 'noEntry', type: 'reg', name: 'Entrada prohibida', meaning: 'Prohibido el acceso a todos los vehículos en ese sentido.', tip: 'Típica en la salida de calles de sentido único.' },
    { k: 'noEstEU', type: 'reg', name: 'Estacionamiento prohibido', meaning: 'Prohibido estacionar. Puedes parar (máximo 2 minutos, sin abandonar el vehículo).', tip: 'Una sola diagonal = no estacionar.' },
    { k: 'noParEU', type: 'reg', name: 'Parada y estacionamiento prohibidos', meaning: 'No puedes ni parar ni estacionar.', tip: 'El aspa (X) prohíbe también parar.' },
    { k: 'vel50', type: 'reg', name: 'Velocidad máxima 50', meaning: 'No superes 50 km/h. En Europa el número va sin unidad.', tip: 'El límite rige hasta la siguiente intersección o señal de fin.' },
    { k: 'velMin60', type: 'reg', name: 'Velocidad mínima 60', meaning: 'Obliga a circular al menos a 60 km/h, salvo que las condiciones no lo permitan.', tip: 'Azul obliga; roja prohíbe. Mismo número, significado opuesto.' },
    { k: 'pasoObl', type: 'reg', name: 'Paso obligatorio', meaning: 'Debes pasar por el lado que indica la flecha, por ejemplo al rodear una isleta.', tip: 'Las señales azules circulares son obligaciones.' },
    { k: 'finProhib', type: 'reg', name: 'Fin de prohibiciones', meaning: 'Terminan todas las prohibiciones señalizadas antes (velocidad, adelantamiento…).', tip: 'Al terminar un límite de velocidad, vuelve el genérico de la vía.' },
    { k: 'ninos', type: 'prev', name: 'Peligro: niños', meaning: 'Lugar frecuentado por niños, como colegios o parques.', tip: 'Reduce y vigila los laterales.' },
    { k: 'peligro', type: 'prev', name: 'Otros peligros', meaning: 'Peligro distinto de los que tienen señal propia. Suele ir con un panel que lo explica.', tip: 'Lee el panel complementario.' },
    { k: 'sanAndres', type: 'prev', name: 'Situación de un paso a nivel', meaning: 'Marca la posición de un paso a nivel sin barreras. Obliga a ceder el paso al tren.', tip: 'Cruz simple: una vía; doble: varias vías.' },
    { k: 'prioridad', type: 'reg', name: 'Calzada con prioridad', meaning: 'Tienes prioridad en las intersecciones de esta vía. En España figura como señal de prioridad.', tip: 'Si aparece tachada, se acaba la prioridad.' },
    { k: 'pasoPeat', type: 'info', name: 'Paso para peatones', meaning: 'Indica la situación de un paso de peatones.', tip: 'Cuadrado azul = indica; triángulo rojo = advierte.' }
  ],
  facts: [
    { title: 'Velocidades genéricas para turismos', rows: [['Autopistas y autovías', '120 km/h (mínima 60 km/h)'], ['Carreteras convencionales', '90 km/h, sin margen extra para adelantar desde 2022'], ['Ciudad: 2 o más carriles por sentido', '50 km/h'], ['Ciudad: 1 carril por sentido', '30 km/h'], ['Ciudad: plataforma única de calzada y acera', '20 km/h']] },
    { title: 'Alcohol y drogas', rows: [['General', '0,5 g/l en sangre · 0,25 mg/l en aire espirado'], ['Noveles (2 primeros años) y profesionales', '0,3 g/l · 0,15 mg/l'], ['Drogas', 'Se sanciona la mera presencia en el organismo']] },
    { title: 'Permiso por puntos', rows: [['Saldo inicial', '12 puntos (máximo 15)'], ['Noveles', '8 puntos'], ['Móvil en la mano', 'Pierdes 6 puntos'], ['Sin cinturón o sin sistema de retención infantil', 'Pierdes 4 puntos']] },
    { title: 'Seguridad y averías', rows: [['Avería en vía interurbana', 'Baliza V-16 conectada, obligatoria desde el 1 de enero de 2026 (sustituye a los triángulos)'], ['Chaleco reflectante', 'Póntelo antes de salir del vehículo en vía interurbana'], ['Niños', 'Menores de 1,35 m: sistema de retención, por norma general en asiento trasero'], ['Neumáticos', 'Profundidad mínima del dibujo: 1,6 mm']] },
    { title: 'Permiso B', rows: [['Masa máxima autorizada', 'Hasta 3.500 kg'], ['Plazas', 'Hasta 9, incluido el conductor'], ['Remolque', 'Ligero de hasta 750 kg'], ['Circulan por la izquierda en Europa', 'Reino Unido, Irlanda, Malta y Chipre']] }
  ],
  raw: [
    { c: 'seg', q: '¿Cuál es la tasa máxima de alcohol en aire espirado para un conductor con permiso B desde hace 5 años?', o: ['0,15 mg/l', '0,25 mg/l', '0,30 mg/l', '0,50 mg/l'], a: 1, e: 'La tasa general es 0,25 mg/l en aire espirado, equivalente a 0,5 g/l en sangre. No confundas las unidades: 0,5 es en sangre (gramos por litro), 0,25 es en aire (miligramos por litro).', t: 'Aire 0,25 = sangre 0,5.' },
    { c: 'seg', q: 'Tienes el permiso B desde hace 14 meses. ¿Cuál es tu tasa máxima de alcohol en aire espirado?', o: ['0,25 mg/l', '0,15 mg/l', '0,10 mg/l', '0,00 mg/l'], a: 1, e: 'Durante los dos primeros años, los conductores noveles tienen un límite de 0,15 mg/l en aire (0,3 g/l en sangre), igual que los profesionales. Es una pregunta trampa frecuente porque mezcla tiempo de permiso y unidades.', t: 'Novel y profesional: 0,15 mg/l en aire.' },
    { c: 'vel', q: 'En una autovía, ¿cuál es la velocidad máxima genérica de un turismo?', o: ['100 km/h', '110 km/h', '120 km/h', '130 km/h'], a: 2, e: 'En autopistas y autovías el máximo genérico para turismos y motos es 120 km/h. La velocidad mínima es la mitad, 60 km/h, salvo que las condiciones lo impidan.', t: 'Autovía: 120 máx., 60 mín.' },
    { c: 'vel', q: 'En una carretera convencional con límite genérico, adelantas a un camión. ¿A qué velocidad máxima puedes hacerlo?', o: ['90 km/h', '100 km/h', '110 km/h', '120 km/h'], a: 0, e: 'Desde 2022 se eliminó el margen de 20 km/h que permitía superar el límite al adelantar en carreteras convencionales. Hoy el máximo sigue siendo 90 km/h también durante el adelantamiento.', t: 'Adelantar no te da margen extra.' },
    { c: 'vel', q: 'En una calle urbana con un único carril por sentido, sin señal, ¿cuál es la velocidad máxima?', o: ['20 km/h', '30 km/h', '40 km/h', '50 km/h'], a: 1, e: 'Desde 2021, el límite urbano depende de la vía: 20 km/h en plataforma única (calzada y acera al mismo nivel), 30 km/h con un carril por sentido y 50 km/h con dos o más carriles por sentido.', t: 'Ciudad: 20 / 30 / 50 según la vía.' },
    { c: 'vel', q: 'Circulas por una calle de plataforma única, con calzada y acera al mismo nivel. ¿Velocidad máxima?', o: ['10 km/h', '20 km/h', '30 km/h', '40 km/h'], a: 1, e: 'En las vías de plataforma única el máximo es 20 km/h, porque peatones y vehículos comparten el espacio sin un bordillo que los separe.', t: 'Plataforma única: 20.' },
    { c: 'vel', q: '¿Cuál es la velocidad mínima en una autopista para un turismo, si las condiciones lo permiten?', o: ['40 km/h', '50 km/h', '60 km/h', '80 km/h'], a: 2, e: 'La mínima en autopistas y autovías es la mitad de la genérica: 60 km/h. Circular más lento sin motivo entorpece y obliga a otros a adelantamientos peligrosos.', t: 'Mínima = mitad de la genérica.' },
    { c: 'lic', q: '¿Con cuántos puntos empieza un conductor novel?', o: ['6 puntos', '8 puntos', '12 puntos', '15 puntos'], a: 1, e: 'El conductor novel empieza con 8 puntos. Si en los dos primeros años no pierde ninguno, pasa a 12. Con buena conducta continuada se puede llegar hasta 15.', t: 'Novel 8, general 12, máximo 15.' },
    { c: 'lic', q: '¿Cuántos puntos se pierden por conducir sujetando el móvil con la mano?', o: ['3 puntos', '4 puntos', '6 puntos', '8 puntos'], a: 2, e: 'Desde la reforma de 2022, sujetar el móvil con la mano mientras conduces cuesta 6 puntos y 200 euros. Antes eran 3 puntos.', t: 'Móvil en mano: 6 puntos.' },
    { c: 'lic', q: '¿Cuántos puntos se pierden por no usar el cinturón o no llevar a un niño en su sistema de retención?', o: ['2 puntos', '3 puntos', '4 puntos', '6 puntos'], a: 2, e: 'Desde 2022 son 4 puntos (antes 3). El conductor es responsable de que los menores viajen correctamente sujetos.', t: 'Cinturón o silla infantil: 4 puntos.' },
    { c: 'con', q: 'Desde el 1 de enero de 2026, en España, ¿qué dispositivo es obligatorio para señalizar una avería en vía interurbana?', o: ['Dos triángulos de emergencia', 'La baliza V-16 conectada', 'Las luces de emergencia del vehículo, nada más', 'Un chaleco colgado del retrovisor'], a: 1, e: 'La baliza V-16 conectada sustituye a los triángulos: se coloca en el techo sin salir a la calzada y envía tu posición a la DGT. Evita el riesgo de caminar por la vía para poner los triángulos, causa de muchos atropellos.', t: 'Avería en 2026: V-16 conectada en el techo.' },
    { c: 'con', q: 'Tu coche se avería en una autovía. ¿Cuándo debes ponerte el chaleco reflectante?', o: ['Solo de noche', 'Antes de salir del vehículo', 'Después de colocar la señalización', 'Solo si vas a cambiar una rueda'], a: 1, e: 'El chaleco se pone antes de bajar del vehículo, por eso conviene llevarlo al alcance del conductor, no en el maletero. Luego sales por el lado más seguro y esperas tras la barrera.', t: 'Chaleco puesto antes de abrir la puerta.' },
    { c: 'seg', q: 'Un niño de 10 años mide 1,32 m. ¿Cómo debe viajar?', o: ['Con el cinturón de adulto en cualquier asiento', 'En un sistema de retención infantil adecuado y, por norma general, en el asiento trasero', 'En el asiento delantero sin sistema de retención', 'Puede elegir, porque ya tiene más de 10 años'], a: 1, e: 'La norma no depende de la edad, sino de la estatura: los menores de 1,35 m deben usar un sistema de retención homologado y, por norma general, viajar atrás. El cinturón de adulto en un niño bajo pasa por el cuello y el abdomen.', t: 'Manda la estatura: menos de 1,35 m, sistema de retención.' },
    { c: 'seg', q: '¿Cuándo puede viajar en el asiento delantero un menor de 1,35 m?', o: ['Nunca', 'Si el vehículo no tiene asientos traseros, si están todos ocupados por otros menores o si no se pueden instalar los sistemas de retención atrás', 'Siempre que use cinturón', 'Si el viaje es urbano y corto'], a: 1, e: 'Son las tres excepciones. En ese caso debe usar su sistema de retención y, si va en una silla a contramarcha, hay que desactivar el airbag frontal del acompañante.', t: 'Silla a contramarcha delante: airbag desactivado.' },
    { c: 'pri', q: 'Vas a tomar la tercera salida de una glorieta de dos carriles. ¿Qué es lo correcto?', o: ['Debes ir siempre por el carril exterior', 'Puedes circular por el carril interior, pero debes pasar al exterior con antelación y salir desde el carril derecho', 'Puedes salir directamente desde el carril interior', 'Debes detenerte antes de cada salida'], a: 1, e: 'Dentro de la glorieta puedes usar el carril interior si vas a una salida lejana, pero debes cambiar al carril exterior con antelación y salir siempre desde el carril derecho. Salir cruzando desde el interior es una causa típica de choques.', t: 'En glorieta, siempre se sale por la derecha.' },
    { c: 'pri', q: 'Al llegar a una glorieta sin señalización especial, ¿quién tiene preferencia?', o: ['Quien entra', 'Quien ya circula por la glorieta', 'El vehículo que viene por la derecha', 'El vehículo más grande'], a: 1, e: 'Los vehículos que circulan dentro de la glorieta tienen preferencia sobre los que pretenden entrar. Normalmente lo refuerza una señal de ceda el paso en cada entrada.', t: 'Glorieta: preferencia de quien circula dentro.' },
    { c: 'pri', q: 'Llegas por un camino de tierra a un cruce sin señalizar con una carretera asfaltada. Un coche se acerca por tu izquierda por el asfalto. ¿Quién pasa?', o: ['Tú, porque vienes por su derecha', 'El coche de la vía pavimentada', 'El que vaya más rápido', 'Pasan a la vez'], a: 1, e: 'La regla de la derecha tiene excepciones. Una de ellas: quien circula por una vía pavimentada tiene preferencia sobre quien sale de una vía sin pavimentar. Por eso cedes, aunque el otro venga por tu izquierda.', t: 'Asfalto gana a tierra.' },
    { c: 'pri', q: 'Vas a adelantar a un ciclista en una carretera con línea continua. ¿Qué dice la norma?', o: ['Está prohibido adelantar con línea continua', 'Puedes invadir el carril contrario aunque haya línea continua, si es seguro, y dejando al menos 1,5 m de separación', 'Puedes adelantar sin dejar distancia si vas despacio', 'Debes tocar el claxon y adelantar sin cambiar de carril'], a: 1, e: 'La norma permite cruzar la línea continua para adelantar a ciclistas si hay visibilidad y no viene nadie, y obliga a dejar una separación lateral mínima de 1,5 m. Además, debes reducir la velocidad.', t: 'Ciclista: 1,5 m, aunque haya línea continua.' },
    { c: 'con', q: 'En un túnel, ¿qué distancia mínima de seguridad debe guardar un turismo con el vehículo de delante?', o: ['50 m o 2 segundos', '100 m o 4 segundos', '150 m o 6 segundos', '200 m o 8 segundos'], a: 1, e: 'En túneles la norma exige al menos 100 metros o 4 segundos para turismos. Para vehículos pesados la distancia es mayor. Un incendio o choque en un túnel es mucho más peligroso que al aire libre.', t: 'Túnel: 100 m o 4 s.' },
    { c: 'con', q: '¿Cuándo está permitido usar la luz antiniebla trasera?', o: ['Siempre que sea de noche', 'Con lluvia ligera', 'Con niebla espesa, lluvia muy intensa, nevada densa o nubes de humo o polvo', 'Cuando un vehículo te sigue muy de cerca'], a: 2, e: 'La antiniebla trasera es tan potente que deslumbra a quien va detrás. Solo se usa en condiciones de visibilidad muy reducidas: niebla espesa, lluvia muy intensa, nevada densa o nubes de humo o polvo.', t: 'Antiniebla trasera: solo con visibilidad muy mala.' },
    { c: 'pri', q: 'Un agente de tráfico levanta el brazo verticalmente. ¿Qué significa?', o: ['Que aceleres', 'Atención, alto para todos los que se acercan, salvo los que no puedan detenerse con seguridad', 'Que gires a la derecha', 'Que solo deben detenerse los peatones'], a: 1, e: 'El brazo levantado verticalmente obliga a detenerse a todos los usuarios que se aproximan al agente, excepto a los que ya no puedan hacerlo en condiciones de seguridad. Las órdenes del agente prevalecen sobre semáforos y señales.', t: 'Brazo arriba = alto para todos.' },
    { c: 'pri', q: 'Un semáforo con luz roja intermitente en un paso a nivel significa:', o: ['Precaución, puedes pasar despacio', 'Prohibido pasar: se aproxima un tren', 'El semáforo está averiado', 'Ceda el paso solo a peatones'], a: 1, e: 'En pasos a nivel, puentes móviles o salidas de emergencia, la luz roja intermitente (o dos alternas) prohíbe el paso. Es distinta de la amarilla intermitente, que solo pide precaución.', t: 'Roja intermitente en paso a nivel: no pases.' },
    { c: 'con', q: 'Dentro de poblado, ¿cuándo está permitido usar el claxon?', o: ['Para saludar', 'Para avisar a otro conductor de que el semáforo está verde', 'Solo para evitar un posible accidente', 'Para avisar de que vas a adelantar'], a: 2, e: 'En poblado las señales acústicas están prohibidas salvo para evitar un accidente. Fuera de poblado sí se pueden usar para avisar de un adelantamiento.', t: 'En ciudad, el claxon solo evita accidentes.' },
    { c: 'con', q: '¿Cuál es el recorrido máximo permitido marcha atrás?', o: ['5 metros, y nunca en autopistas ni autovías', '15 metros, y nunca en autopistas ni autovías', '25 metros en cualquier vía', 'Sin límite si es seguro'], a: 1, e: 'La marcha atrás se limita a lo imprescindible: no más de 15 metros y sin invadir un cruce. En autopistas y autovías está prohibida.', t: 'Marcha atrás: 15 m como máximo.' },
    { c: 'con', q: '¿Cuál es la profundidad mínima legal del dibujo de los neumáticos de un turismo?', o: ['1 mm', '1,6 mm', '2,5 mm', '3 mm'], a: 1, e: 'El mínimo legal en la Unión Europea es 1,6 mm en las ranuras principales. Con menos de 3 mm la capacidad de evacuar agua cae mucho, por lo que se recomienda cambiarlos antes.', t: '1,6 mm es el mínimo legal, no el ideal.' },
    { c: 'lic', q: 'Con el permiso B, ¿qué vehículo puedes conducir?', o: ['Un camión de 5.000 kg', 'Un turismo de hasta 3.500 kg de masa máxima y 9 plazas como máximo, incluido el conductor', 'Un autobús de 12 plazas', 'Cualquier vehículo si no lleva carga'], a: 1, e: 'El permiso B autoriza vehículos de hasta 3.500 kg de masa máxima autorizada y hasta 9 plazas incluido el conductor. También permite un remolque ligero de hasta 750 kg.', t: 'B: 3.500 kg y 9 plazas.' },
    { c: 'lic', q: '¿Qué países europeos circulan por la izquierda?', o: ['Reino Unido, Irlanda, Malta y Chipre', 'Reino Unido, Portugal y Grecia', 'Solo el Reino Unido', 'Reino Unido, Suecia e Irlanda'], a: 0, e: 'Son cuatro: Reino Unido, Irlanda, Malta y Chipre. Suecia cambió a la derecha en 1967. Si conduces allí, recuerda que en las glorietas se gira en el sentido de las agujas del reloj.', t: 'Izquierda en Europa: RU, Irlanda, Malta, Chipre.' },
    { c: 'seg', q: 'Un conductor da positivo en un control de drogas, aunque conduce con normalidad. ¿Qué ocurre?', o: ['Nada, porque no hay síntomas', 'Se sanciona la presencia de drogas en el organismo, aunque no haya síntomas', 'Solo se sanciona si causa un accidente', 'Solo una advertencia la primera vez'], a: 1, e: 'En España se sanciona la mera presencia de drogas en el organismo, con 1.000 euros y 6 puntos, sin necesidad de demostrar que afecten a la conducción. Si además conduce bajo su influencia, puede ser delito.', t: 'Drogas: tolerancia cero.' },
    { c: 'seg', q: '¿Está exenta una conductora embarazada de usar el cinturón?', o: ['Sí, siempre', 'Sí, a partir del sexto mes', 'No, debe usarlo con la banda inferior bajo el abdomen', 'Solo con certificado médico de cualquier tipo'], a: 2, e: 'Las embarazadas no están exentas. Deben colocar la banda inferior lo más baja posible, sobre las caderas y bajo el abdomen, y la diagonal entre los pechos.', t: 'Embarazo: cinturón bajo el vientre.' },
    { c: 'con', q: 'En un viaje largo, ¿cada cuánto recomienda la DGT hacer una pausa?', o: ['Cada 4 horas o 400 km', 'Cada 2 horas o 200 km', 'Solo cuando notes sueño', 'Cada hora'], a: 1, e: 'La recomendación es parar unos 20 minutos cada 2 horas o 200 km. La fatiga aparece antes de notar sueño y alarga el tiempo de reacción.', t: 'Cada 2 horas o 200 km.' },
    { c: 'sen', s: 'noEstEU', q: 'Ante esta señal, ¿puedes parar un minuto para que se baje un pasajero?', o: ['No, está prohibido parar', 'Sí, porque solo prohíbe estacionar', 'Solo si dejas las luces de emergencia', 'Solo en horario nocturno'], a: 1, e: 'El círculo azul con borde rojo y una sola diagonal prohíbe estacionar. Si lleva un aspa (dos diagonales), prohíbe también parar. Parar es inmovilizar el vehículo menos de 2 minutos sin que el conductor lo abandone.', t: 'Una diagonal: no estacionar. Aspa: ni parar.' },
    { c: 'sen', s: 'prioridad', q: '¿Qué indica esta señal?', o: ['Peligro: obras', 'Calzada con prioridad en las intersecciones', 'Ceda el paso', 'Zona de estacionamiento'], a: 1, e: 'El rombo amarillo con borde blanco indica que circulas por una calzada con prioridad: los que se incorporan desde las vías transversales deben cederte el paso. Si aparece tachado, termina la prioridad.', t: 'Rombo amarillo y blanco = tú tienes prioridad.' },
    { c: 'sen', s: 'sanAndres', q: 'Esta señal (cruz de San Andrés) indica:', o: ['Cruce de carreteras', 'Situación de un paso a nivel sin barreras', 'Prohibido el paso', 'Hospital cercano'], a: 1, e: 'La cruz de San Andrés marca la situación de un paso a nivel sin barreras. Debes ceder el paso al tren y no cruzar si se aproxima. Cruz sencilla: una vía; doble: dos o más vías.', t: 'Cruz de San Andrés = el tren pasa aquí.' },
    { c: 'sen', s: 'velMin60', q: '¿Qué significa esta señal?', o: ['Velocidad máxima 60', 'Velocidad mínima 60, salvo que las condiciones no lo permitan', 'Velocidad recomendada 60', 'Fin de limitación de 60'], a: 1, e: 'Las señales circulares azules son de obligación: esta obliga a circular al menos a 60 km/h. La misma cifra en un círculo blanco con borde rojo sería una velocidad máxima.', t: 'Azul obliga; rojo prohíbe.' }
  ]
});
</script>
<script>
window.ADM.REGIONS.push({
  id: 'as', name: 'Asia', code: 'JP', country: 'Japón',
  ref: 'Japón: Ley de Tránsito Vial (道路交通法) y la guía de normas de tránsito de la Comisión Nacional de Seguridad Pública',
  side: 'izquierda', units: 'km/h',
  exam: { official: 'Examen definitivo: 95 preguntas de verdadero o falso (90 de 1 punto y 5 casos ilustrados de 2 puntos) · 50 minutos · aprobar con 90 de 100', size: 24, officialSize: 95, minutes: 13, pass: 0.9 },
  caveat: 'Asia no tiene un reglamento común: China, India o Corea tienen normas muy distintas. Se usa Japón como referencia porque su examen es de los más exigentes. Como en el examen real, la mayoría de preguntas son de verdadero o falso, con trampas en una sola palabra.',
  signTypes: { reg: 'Reglamentarias (規制)', prev: 'Preventivas (警戒)', info: 'Indicativas y marcas (指示)' },
  signLegend: { reg: 'Círculo rojo prohíbe; triángulo rojo invertido: 止まれ (alto) o 徐行 (ir muy despacio). Los números de velocidad son azules.', prev: 'Rombo amarillo.', info: 'Cuadrados y rectángulos azules; marcas de conductor principiante.' },
  signs: [
    { k: 'tomare', type: 'reg', name: '止まれ (Tomare): Alto', meaning: 'Detención obligatoria en la línea. En Japón es un triángulo rojo invertido, no un octágono.', tip: 'Desde 2017 muchas llevan también la palabra STOP.' },
    { k: 'jokou', type: 'reg', name: '徐行 (Jokō): Ir muy despacio', meaning: 'Circula a una velocidad que te permita detenerte de inmediato (en la práctica, 10 km/h o menos).', tip: 'Misma forma que 止まれ: lee el texto.' },
    { k: 'speedJP', type: 'reg', name: 'Velocidad máxima 40', meaning: 'Máximo 40 km/h. En Japón los números son azules.', tip: 'Si la cifra está subrayada, es velocidad mínima.' },
    { k: 'noEstEU', type: 'reg', name: '駐車禁止: Prohibido estacionar', meaning: 'No puedes estacionar; detenerte un momento sí está permitido.', tip: 'Una diagonal: no estacionar. Aspa: ni detenerse.' },
    { k: 'noParEU', type: 'reg', name: '駐停車禁止: Prohibido detenerse y estacionar', meaning: 'No puedes ni detenerte ni estacionar.', tip: 'El aspa prohíbe ambas cosas.' },
    { k: 'noEntry', type: 'reg', name: '車両進入禁止: Entrada prohibida', meaning: 'Prohibido entrar en ese sentido.', tip: 'Marca la salida de un sentido único.' },
    { k: 'fumikiri', type: 'prev', name: '踏切あり: Paso a nivel', meaning: 'Paso a nivel más adelante. En Japón siempre hay que detenerse antes de cruzar.', tip: 'Detente, mira y escucha, aunque no venga tren.' },
    { k: 'curva', type: 'prev', name: 'Curva', meaning: 'Curva adelante. Reduce antes de entrar.', tip: 'Frena en la recta, antes de la curva.' },
    { k: 'pasoPeat', type: 'info', name: '横断歩道: Paso de peatones', meaning: 'Indica la ubicación de un paso de peatones.', tip: 'Una marca ◇ en el asfalto avisa que hay un paso de peatones adelante.' },
    { k: 'ippou', type: 'info', name: '一方通行: Sentido único', meaning: 'Calle de un solo sentido, en la dirección de la flecha.', tip: 'Rectángulo azul con flecha blanca.' },
    { k: 'wakaba', type: 'info', name: '初心者マーク: Marca de principiante', meaning: 'Obligatoria durante el primer año con licencia. Está prohibido cerrarle el paso o acercarse lateralmente.', tip: 'Amarillo a la izquierda, verde a la derecha.' }
  ],
  facts: [
    { title: 'Circulación', rows: [['Lado', 'Por la izquierda; se adelanta por la derecha'], ['Velocidad legal sin señal (turismos)', '60 km/h en vías generales'], ['Autopistas', 'Máximo 100 km/h (120 km/h en tramos señalizados), mínimo 50 km/h'], ['徐行 (jokō)', 'Velocidad que permite detenerse de inmediato, unos 10 km/h']] },
    { title: 'Alcohol', rows: [['Conducción con alcohol (酒気帯び)', '0,15 mg/l o más en aire espirado'], ['Conducción ebria (酒酔い)', 'Se sanciona por el estado, sin importar la cifra'], ['Responsabilidad compartida', 'También se sanciona a quien presta el vehículo, sirve el alcohol o viaja con un conductor bebido sabiéndolo']] },
    { title: 'Distancias de prohibición', rows: [['No detenerse ni estacionar', 'A menos de 5 m de una intersección o de un paso de peatones'], ['Paso a nivel', 'No detenerse ni estacionar a menos de 10 m'], ['Hidrante', 'No estacionar a menos de 5 m'], ['Adelantar', 'Prohibido en los 30 m anteriores a una intersección, un paso a nivel o un paso de peatones']] },

  ],
  raw: [
    { c: 'pri', q: 'En Japón se circula por la izquierda y, por regla general, se adelanta por la derecha.', v: true, e: 'Japón circula por la izquierda, como Reino Unido o Australia. El adelantamiento se hace por la derecha del vehículo adelantado, salvo cuando este va a girar a la derecha y se ha colocado en el centro de la vía.', t: 'Izquierda para circular, derecha para adelantar.' },
    { c: 'vel', q: 'En una vía general sin señal de velocidad, ¿cuál es la velocidad legal máxima de un turismo?', o: ['40 km/h', '50 km/h', '60 km/h', '80 km/h'], a: 2, e: 'Si no hay señal, la velocidad legal (法定速度) de un turismo en vías generales es 60 km/h. Los ciclomotores de hasta 50 cc tienen 30 km/h.', t: 'Sin señal: 60 km/h.' },
    { c: 'vel', q: 'En las autopistas japonesas, la velocidad mínima legal es 50 km/h.', v: true, e: 'En autopistas (高速自動車国道) la velocidad mínima es 50 km/h, salvo atascos o condiciones que lo impidan. El máximo general es 100 km/h, con tramos señalizados a 120 km/h.', t: 'Autopista: mínima 50.' },
    { c: 'con', q: 'Ante un paso a nivel sin semáforo, solo debes detenerte si se acerca un tren.', v: false, e: 'Es falso. En Japón hay que detenerse siempre antes de un paso a nivel, mirar y escuchar, aunque no venga tren. Solo puedes pasar sin detenerte si hay un semáforo en el paso a nivel y está en verde.', t: 'Paso a nivel: alto siempre.' },
    { c: 'con', q: 'Si el paso a nivel tiene un semáforo en verde, puedes cruzar sin detenerte después de comprobar la seguridad.', v: true, e: 'Es la única excepción a la detención obligatoria: con semáforo verde en el paso a nivel puedes cruzar sin parar, aunque debes comprobar que es seguro.', t: 'Semáforo verde en el paso a nivel: sin detenerte.' },
    { c: 'con', q: 'Está prohibido detenerse o estacionar a menos de 10 m de un paso a nivel.', v: true, e: 'Es correcto: los 10 m antes y después de un paso a nivel son zona de prohibición de detención y estacionamiento. Un vehículo detenido ahí puede impedir que otros despejen las vías.', t: 'Paso a nivel: 10 m.' },
    { c: 'sen', s: 'tomare', q: '¿Qué significa esta señal?', o: ['Ceda el paso', 'Alto: detención obligatoria', 'Prohibido el paso', 'Ir muy despacio'], a: 1, e: 'En Japón la señal de alto es un triángulo rojo invertido con 止まれ (tomare). Debes detenerte en la línea. El mismo formato con 徐行 significa ir muy despacio, así que hay que leer el texto.', t: '止まれ = alto. 徐行 = muy despacio.' },
    { c: 'sen', s: 'speedJP', q: 'Esta señal indica una velocidad mínima de 40 km/h.', v: false, e: 'Es falso. Es una velocidad máxima de 40 km/h (en Japón los números son azules). La velocidad mínima se indica con un círculo azul y la cifra subrayada.', t: 'Número azul en círculo rojo = máxima.' },
    { c: 'lic', q: 'Está prohibido cerrarle el paso o acercarse lateralmente a un vehículo con la marca de principiante, salvo para evitar un peligro.', v: true, e: 'La marca de principiante (初心者マーク) protege a quien lleva menos de un año con licencia. Acercarse de lado o meterse delante de forma forzada está prohibido y se sanciona.', t: 'Wakaba: dale espacio.' },
    { c: 'lic', q: '¿Durante cuánto tiempo es obligatorio llevar la marca de principiante (wakaba)?', o: ['3 meses', '6 meses', '1 año', '3 años'], a: 2, e: 'Es obligatoria durante el primer año desde que obtienes la licencia de turismo. Los mayores de 70 años tienen su propia marca, que se recomienda llevar.', t: 'Wakaba: el primer año.' },
    { c: 'seg', q: 'En Japón se sanciona conducir con 0,15 mg/l o más de alcohol en el aire espirado.', v: true, e: 'Desde 0,15 mg/l es conducción con alcohol (酒気帯び). La conducción en estado de ebriedad (酒酔い) se sanciona según el estado del conductor, sin importar la cifra, y es mucho más grave.', t: '0,15 mg/l en aire.' },
    { c: 'seg', q: 'Si un pasajero sabe que el conductor ha bebido y aun así viaja con él, también puede ser sancionado.', v: true, e: 'Japón castiga a todo el entorno: a quien presta el vehículo, a quien sirve alcohol a alguien que va a conducir y a quien viaja sabiendo que el conductor bebió.', t: 'En Japón, todos responden.' },
    { c: 'seg', q: 'Los niños menores de 6 años deben usar un sistema de retención infantil.', v: true, e: 'Es obligatorio para menores de 6 años, salvo excepciones como problemas médicos o cuando el vehículo no puede alojar la silla.', t: 'Menores de 6: silla.' },
    { c: 'seg', q: 'Fuera de las autopistas, los pasajeros de los asientos traseros no están obligados a usar el cinturón.', v: false, e: 'Es falso. Desde 2008 el cinturón es obligatorio en todos los asientos, en cualquier vía. La diferencia es solo de sanción: en vías generales no suma puntos para el conductor, pero sigue siendo obligatorio.', t: 'Cinturón en todos los asientos.' },
    { c: 'vel', q: '徐行 (jokō) significa reducir la velocidad a la mitad del límite señalizado.', v: false, e: 'Es falso. 徐行 es circular a una velocidad que te permita detenerte de inmediato; en la práctica, unos 10 km/h o menos. Se exige en cruces sin visibilidad, curvas cerradas y al pasar junto a peatones.', t: '徐行 = poder detenerte al instante.' },
    { c: 'pri', q: 'Vas a girar a la derecha en una intersección (cruzando el sentido contrario). Un vehículo viene de frente para seguir recto. ¿Quién pasa primero?', o: ['Tú, porque entraste primero a la intersección', 'El vehículo que sigue recto o gira a la izquierda', 'El vehículo de mayor tamaño', 'Quien toque primero la bocina'], a: 1, e: 'En Japón, al girar a la derecha cruzas el sentido contrario, así que cedes el paso a quien sigue recto o gira a la izquierda, aunque tú hayas entrado primero a la intersección.', t: 'Giro a la derecha: cede a los de frente.' },
    { c: 'sen', q: 'Una marca en forma de rombo (◇) pintada en el carril indica que hay un paso de peatones más adelante.', v: true, e: 'Es correcto. La marca ◇ anuncia un paso de peatones próximo. Si no ves claramente que no hay nadie por cruzar, debes reducir para poder detenerte antes.', t: '◇ en el asfalto = paso de peatones cerca.' },
    { c: 'pri', q: 'Si un peatón está a punto de cruzar por un paso de peatones sin semáforo, basta con tocar la bocina y pasar.', v: false, e: 'Es falso. Debes detenerte antes del paso y dejarlo cruzar. Usar la bocina para apurar a un peatón está prohibido y además es una infracción con puntos.', t: 'Peatón por cruzar: alto.' },
    { c: 'con', q: 'Se acerca un vehículo de emergencia cuando estás cerca de una intersección. Debes detenerte de inmediato dentro de la intersección.', v: false, e: 'Es falso. Cerca de una intersección debes salir de ella y luego orillarte a la izquierda y detenerte. Fuera de intersecciones, te orillas a la izquierda para cederle el paso.', t: 'Ambulancia: sal del cruce y oríllate a la izquierda.' },
    { c: 'con', q: '¿A qué distancia de una intersección está prohibido detenerse o estacionar?', o: ['3 m', '5 m', '10 m', '15 m'], a: 1, e: 'Está prohibido detenerse o estacionar a menos de 5 m de una intersección y de un paso de peatones. Junto a un paso a nivel la distancia es de 10 m.', t: 'Intersección y paso de peatones: 5 m.' },
    { c: 'pri', q: 'Está prohibido adelantar en los 30 m anteriores a un paso de peatones.', v: true, e: 'Es correcto. Tampoco puedes adelantar en el propio paso ni en los 30 m previos a intersecciones y pasos a nivel. Un vehículo adelantado puede ocultar a un peatón que está cruzando.', t: '30 m antes: no adelantes.' },
    { c: 'pri', q: '¿Con cuánta anticipación debes señalizar un giro a la izquierda?', o: ['10 m antes', '30 m antes', '3 segundos antes', '100 m antes'], a: 1, e: 'Para girar debes señalizar 30 m antes del punto de giro. Para cambiar de carril, 3 segundos antes de empezar la maniobra.', t: 'Giro 30 m; cambio de carril 3 s.' },
    { c: 'con', q: 'De noche, la regla general es circular con luces altas y cambiar a bajas al cruzarte con otro vehículo o al seguir a otro.', v: true, e: 'Es correcto. La norma japonesa trata las luces altas como las de “circulación” y las bajas como las de “cruce”. Hay que cambiar a bajas cuando hay vehículos de frente o delante, para no deslumbrar.', t: 'Altas por defecto, bajas al cruzarte.' },
    { c: 'con', q: 'Al pasar junto a un autobús escolar detenido, debes reducir la velocidad hasta 徐行 y comprobar la seguridad.', v: true, e: 'Es correcto. Los niños pueden bajar del bus y cruzar de golpe. Debes pasar muy despacio, listo para detenerte.', t: 'Bus escolar detenido: 徐行.' },
    { c: 'pri', q: 'Con luz amarilla debes detenerte en la línea de detención, salvo que estés tan cerca que no puedas hacerlo con seguridad.', v: true, e: 'Es correcto. El amarillo no es una invitación a acelerar: si puedes detenerte con seguridad, debes hacerlo.', t: 'Amarillo = alto si es seguro.' },
    { c: 'pri', q: 'Con luz roja intermitente debes detenerte en la línea y continuar después de comprobar la seguridad.', v: true, e: 'Es correcto. La roja intermitente obliga a una detención momentánea, como 止まれ. La amarilla intermitente solo pide precaución.', t: 'Roja intermitente = alto y sigue.' },
    { c: 'lic', q: 'Puedes estacionar a 3 m de un hidrante si no hay señal que lo prohíba.', v: false, e: 'Es falso. Está prohibido estacionar a menos de 5 m de un hidrante o de una toma de agua contra incendios, haya o no señal.', t: 'Hidrante: 5 m.' },
    { c: 'sen', s: 'noEstEU', q: 'Ante esta señal está prohibido estacionar, pero puedes detenerte un momento para dejar a un pasajero.', v: true, e: 'Es correcto. Una sola diagonal (駐車禁止) prohíbe estacionar. Con aspa (駐停車禁止) también estaría prohibido detenerse.', t: 'Una diagonal: no estacionar.' }
  ]
});
</script>
<script>
window.ADM.REGIONS.push({

  caveat: 'África no tiene un reglamento común. Se usa Sudáfrica como referencia porque su examen (K53) está muy estandarizado. Varios países vecinos aplican normas parecidas, pero no idénticas.',
  signTypes: { reg: 'Regulatory (reglamentarias)', prev: 'Warning (preventivas)', info: 'Guidance (informativas)' },
  signLegend: { reg: 'Círculo con borde rojo, STOP y YIELD. Obligan o prohíben.', prev: 'Triángulo con borde rojo. Avisan de un peligro.', info: 'Rectángulos verdes y azules.' },
  signs: [
    { k: 'stop', type: 'reg', name: 'STOP', meaning: 'Detención total en la línea de parada.', tip: 'Con placa 4-WAY: pasa primero quien se detuvo primero.' },

    { k: 'cedaEU', type: 'reg', name: 'YIELD', meaning: 'Cede el paso a los vehículos y peatones de la vía a la que entras.', tip: 'Triángulo invertido sin texto.' },

    { k: 'vel120', type: 'reg', name: 'Velocidad máxima 120', meaning: 'Máximo 120 km/h, el límite genérico en autopistas (freeways).', tip: 'Ningún vehículo puede superar 120 km/h en Sudáfrica.' },
    { k: 'noOvertake', type: 'reg', name: 'No adelantar', meaning: 'Prohibido adelantar a vehículos de motor en ese tramo.', tip: 'El vehículo rojo es el que no puede adelantar.' },
    { k: 'noEntry', type: 'reg', name: 'No entry', meaning: 'Prohibido entrar en esa dirección.', tip: 'Típica en salidas de autopista.' },
    { k: 'pedZA', type: 'prev', name: 'Pedestrians', meaning: 'Peatones en la vía o cerca de ella más adelante.', tip: 'En zonas rurales los peatones suelen caminar por el arcén.' },
    { k: 'robotZA', type: 'prev', name: 'Traffic signal (robot) ahead', meaning: 'Hay un semáforo más adelante. En Sudáfrica se le llama “robot”.', tip: 'Prepárate para detenerte.' },
    { k: 'peligro', type: 'prev', name: 'General warning', meaning: 'Peligro no especificado; suele ir con una placa que lo explica.', tip: 'Lee la placa complementaria.' }
  ],
  facts: [
    { title: 'Velocidades genéricas', rows: [['Zona urbana', '60 km/h'], ['Vía pública fuera de zona urbana', '100 km/h'], ['Autopista (freeway)', '120 km/h']] },
    { title: 'Alcohol', rows: [['Conductores en general', '0,05 g por 100 ml de sangre (0,5 g/l) · 0,24 mg por 1.000 ml de aire'], ['Conductores profesionales', '0,02 g por 100 ml de sangre']] },
    { title: 'Licencias', rows: [['Learner’s licence', 'Desde los 17 años (vehículo ligero)'], ['Driving licence', 'Desde los 18 años'], ['Aprendiz', 'Siempre acompañado por alguien con licencia de esa clase, sentado a su lado']] },
    { title: 'Prioridades y costumbres viales', rows: [['4-way stop', 'Primero en detenerse, primero en avanzar'], ['Robot apagado o averiado', 'Trátalo como un 4-way stop'], ['Arcén (yellow line)', 'Solo de día, con buena visibilidad, para dejar pasar a un vehículo más rápido'], ['Distancia de seguimiento K53', 'Mínimo 2 segundos; más con mal tiempo']] },
    { title: 'Seguridad', rows: [['Cinturón', 'Obligatorio para todos los ocupantes'], ['Menores de 3 años', 'Sistema de retención infantil obligatorio'], ['Teléfono', 'Solo manos libres']] }
  ],
  raw: [
    { c: 'vel', q: 'En una zona urbana sin señal de velocidad, ¿cuál es el máximo en Sudáfrica?', o: ['40 km/h', '50 km/h', '60 km/h', '80 km/h'], a: 2, e: 'El límite genérico urbano es 60 km/h. En vías públicas fuera de zona urbana es 100 km/h y en autopistas 120 km/h.', t: '60 / 100 / 120.' },
    { c: 'vel', q: 'En una carretera pública fuera de zona urbana que no es autopista, ¿velocidad genérica máxima?', o: ['80 km/h', '100 km/h', '110 km/h', '120 km/h'], a: 1, e: 'Fuera de zona urbana el máximo genérico es 100 km/h. Solo las autopistas (freeways) tienen 120 km/h.', t: 'Rural: 100.' },
    { c: 'vel', q: 'En Sudáfrica, el límite genérico más alto es 120 km/h y corresponde a las autopistas.', v: true, e: 'Es correcto: 120 km/h es el límite genérico de las autopistas (freeways) y no hay vías con un límite genérico superior. Además, algunos vehículos, como los pesados, tienen límites propios más bajos.', t: '120 es el techo.' },
    { c: 'seg', q: '¿Cuál es el límite de alcohol en sangre para un conductor no profesional?', o: ['0,02 g por 100 ml', '0,05 g por 100 ml', '0,08 g por 100 ml', '0,10 g por 100 ml'], a: 1, e: 'El límite es 0,05 g por 100 ml de sangre (equivale a 0,5 g/l). En aire espirado son 0,24 mg por 1.000 ml. Para conductores profesionales baja a 0,02 g por 100 ml.', t: 'General 0,05; profesional 0,02.' },
    { c: 'seg', q: 'El límite de alcohol para un conductor profesional (taxi, bus, camión) es el mismo que para un particular.', v: false, e: 'Es falso. Los conductores profesionales tienen un límite mucho más bajo: 0,02 g por 100 ml de sangre.', t: 'Profesional: 0,02.' },
    { c: 'pri', q: 'En un cruce “4-way stop”, ¿quién tiene derecho de paso?', o: ['El vehículo que viene por la derecha', 'El primero en detenerse en la línea de STOP', 'El vehículo más grande', 'El que va a seguir recto'], a: 1, e: 'En un 4-way stop el orden lo marca la llegada: el primero que se detiene completamente en la línea es el primero en avanzar.', t: 'Primero en parar, primero en pasar.' },
    { c: 'pri', q: 'Llegas a un cruce donde el semáforo (robot) está apagado por un corte de luz. ¿Qué haces?', o: ['Paso con precaución: sin semáforo, tengo preferencia', 'Lo trato como un 4-way stop', 'Cedo solo a los vehículos de mi derecha', 'Espero a que vuelva la luz'], a: 1, e: 'Un robot apagado o averiado se trata como un 4-way stop: te detienes y avanzas en orden de llegada. Es muy común durante los cortes de energía programados (load shedding).', t: 'Robot apagado = 4-way stop.' },
    { c: 'pri', q: 'Sudáfrica circula por la izquierda. ¿Por qué lado se adelanta normalmente?', o: ['Por la izquierda', 'Por la derecha', 'Por el arcén', 'Por cualquier lado'], a: 1, e: 'Al circular por la izquierda, el adelantamiento normal es por la derecha. Adelantar por la izquierda solo se admite en casos concretos, como en vías de varios carriles en el mismo sentido o cuando el otro vehículo gira a la derecha.', t: 'Izquierda para circular, derecha para adelantar.' },
    { c: 'pri', q: 'En una carretera de un carril por sentido, ¿cuándo puedes circular por el arcén (más allá de la línea amarilla) para dejar pasar a un vehículo más rápido?', o: ['Nunca', 'De día, con buena visibilidad y solo el tiempo necesario para dejarlo pasar', 'De noche, para no deslumbrar', 'Siempre que quieras'], a: 1, e: 'El reglamento permite usar el arcén pavimentado de forma temporal, de día y con visibilidad suficiente, para que te adelante un vehículo más rápido. No es un carril para circular de forma permanente ni para adelantar.', t: 'Arcén: solo para dejar pasar, de día.' },
    { c: 'lic', q: '¿A qué edad se puede obtener la learner’s licence para un vehículo ligero?', o: ['16 años', '17 años', '18 años', '21 años'], a: 1, e: 'Para vehículos ligeros (código 1) la learner’s licence se obtiene desde los 17 años. La licencia de conducir completa, desde los 18.', t: 'Learner 17, licencia 18.' },
    { c: 'lic', q: 'Un aprendiz con learner’s licence puede conducir solo si lleva la licencia encima.', v: false, e: 'Es falso. Debe ir acompañado por una persona con licencia de conducir de esa misma clase, sentada a su lado.', t: 'Aprendiz: siempre acompañado.' },
    { c: 'lic', q: 'El examen de learner’s licence se divide en tres partes. ¿Cuáles son?', o: ['Reglas, señales y controles del vehículo', 'Reglas, mecánica y primeros auxilios', 'Señales, mapas y reglas', 'Teoría, práctica y psicotécnico'], a: 0, e: 'Tiene tres secciones: reglas de tránsito, señales y controles del vehículo. Hay que aprobar cada parte por separado: no basta con una buena nota total.', t: 'Cada sección se aprueba por separado.' },
    { c: 'con', q: 'Según el método K53, ¿cuál es la distancia mínima de seguimiento en buenas condiciones?', o: ['1 segundo', '2 segundos', '5 segundos', '10 metros'], a: 1, e: 'El manual K53 usa la regla de los 2 segundos como mínimo en buenas condiciones, y pide aumentarla con lluvia, de noche o con mala visibilidad.', t: 'K53: 2 segundos mínimo.' },
    { c: 'con', q: 'Según el procedimiento K53, antes de cambiar de carril debes:', o: ['Señalizar y girar enseguida', 'Mirar los espejos, señalizar y comprobar el punto ciego antes de moverte', 'Tocar la bocina', 'Reducir a 20 km/h'], a: 1, e: 'El K53 sigue una secuencia de observación: espejos, señal, punto ciego y maniobra. En el examen práctico se penaliza no girar la cabeza para mirar el punto ciego.', t: 'Espejos, señal, punto ciego, maniobra.' },
    { c: 'seg', q: 'Los menores de 3 años deben viajar en un sistema de retención infantil.', v: true, e: 'Es correcto: desde 2015 es obligatorio para menores de 3 años. Además, todos los ocupantes deben usar cinturón si el asiento lo tiene.', t: 'Menores de 3: silla.' },
