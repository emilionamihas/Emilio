<style>
  /* Layout: una columna centrada (máx. 1100px); navegación arriba en escritorio y abajo en móvil.
     Tipografía Barlow: nació de la rotulación de carreteras, por eso encaja con el tema. */
  :root {
    --bg: #0b0f19;
    --surface: rgba(255, 255, 255, 0.035);
    --surface-solid: #121827;
    --line: rgba(255, 255, 255, 0.09);
    --fg: #e7eaf3;
    --muted: #8a93a8;
    --emerald: #10b981;
    --indigo: #6366f1;
    --coral: #f43f5e;
    --amber: #f59e0b;
    --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: var(--font-body); font-size: 16px; -webkit-font-smoothing: antialiased; }
  .font-display { letter-spacing: 0.01em; }
  .tnum { font-variant-numeric: tabular-nums; }

  .atmos {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(60rem 40rem at -10% -10%, rgba(16, 185, 129, 0.13), transparent 60%),
      radial-gradient(50rem 36rem at 110% 0%, rgba(99, 102, 241, 0.16), transparent 60%),
      radial-gradient(40rem 30rem at 50% 120%, rgba(244, 63, 94, 0.07), transparent 60%);
  }
  .shell {
    position: relative; z-index: 1;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .glass {
    background: var(--surface);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: 1rem;
  }
  .lane {
    height: 2px;
    background: repeating-linear-gradient(90deg, rgba(250, 204, 21, 0.55) 0 18px, transparent 18px 32px);
    opacity: 0.6;
  }
  .bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding-top: 8px;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    padding-left: max(10px, env(safe-area-inset-left, 0px));
    padding-right: max(10px, env(safe-area-inset-right, 0px));
    background: rgba(11, 15, 25, 0.82);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
  }
  :focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; border-radius: 10px; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.02); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  @keyframes flicker { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.08) rotate(-3deg); } }
  .view { animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .reveal { animation: rise 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .pop { animation: pop 0.45s ease-out; }
  .shake { animation: shake 0.42s ease-out; }
  .flame { animation: flicker 2.4s ease-in-out infinite; transform-origin: 50% 80%; }

  /* Tarjetas de señales con volteo */
  .flip { perspective: 1200px; }
  .flip-inner {
    position: relative; height: 300px; width: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.3, 0.7, 0.2, 1);
    cursor: pointer;
  }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 1rem; border: 1px solid var(--line);
    background: linear-gradient(160deg, rgba(30, 37, 56, 0.92), rgba(16, 21, 34, 0.96));
  }
  .face.back { transform: rotateY(180deg); }

  .bar-fill { transition: width 1.1s cubic-bezier(0.2, 0.7, 0.2, 1); }

  @media (prefers-reduced-motion: reduce) {
    .view, .reveal, .pop, .shake, .flame { animation: none !important; }
    .flip-inner { transition-duration: 0.01s; }
    .bar-fill { transition: none; }
  }
</style>

<script>

<script>
window.ADM.REGIONS = window.ADM.REGIONS || [];

  raw: [
    { c: 'vel', q: 'Circulas por un jirón del Cercado de Lima y no hay ninguna señal de velocidad. ¿Cuál es el máximo permitido?', o: ['30 km/h', '40 km/h', '50 km/h', '60 km/h'], a: 1, e: 'El Reglamento (art. 162) fija 40 km/h en calles y jirones cuando no hay una señal que indique otro valor. En avenidas son 60 km/h y en vías expresas 80 km/h. El examen suele mezclar estos tres valores, así que apréndelos juntos.', t: 'Jirón 40, avenida 60, vía expresa 80.' },
    { c: 'vel', q: 'En una avenida urbana sin señalización de velocidad, el máximo permitido es:', o: ['40 km/h', '50 km/h', '60 km/h', '80 km/h'], a: 2, e: 'En avenidas el límite genérico es 60 km/h. Si la avenida pasa frente a un colegio o un hospital, baja a 30 km/h en ese tramo, aunque no veas otra señal de velocidad.', t: 'Avenida 60, salvo zona escolar u hospital (30).' },
    { c: 'vel', q: 'Entras a una vía expresa urbana como la Vía de Evitamiento. Sin señal específica, ¿cuál es la velocidad máxima?', o: ['60 km/h', '70 km/h', '80 km/h', '100 km/h'], a: 2, e: 'Las vías expresas urbanas tienen un máximo genérico de 80 km/h. Muchas tienen señales que fijan otro valor por tramos; la señal siempre prevalece sobre el límite genérico.', t: 'La señal manda sobre el límite genérico.' },
    { c: 'vel', q: 'Pasas frente a un colegio en horario de clases. Si no hay señal que indique otro valor, ¿cuál es la velocidad máxima?', o: ['20 km/h', '30 km/h', '35 km/h', '40 km/h'], a: 1, e: 'En zonas escolares y de hospitales el máximo es 30 km/h. Además, los niños pueden cruzar sin mirar, así que debes ir preparado para detenerte.', t: 'Colegio u hospital: 30 km/h.', s: null },
    { c: 'vel', q: 'Conduces un automóvil por una carretera sin señal de velocidad. ¿Cuál es el máximo?', o: ['80 km/h', '90 km/h', '100 km/h', '120 km/h'], a: 2, e: 'En carreteras el máximo para automóviles, camionetas y motocicletas es 100 km/h. Los ómnibus tienen 90 km/h y los vehículos de carga 80 km/h. En Perú no existe un límite genérico de 120 km/h.', t: 'Auto 100, bus 90, carga 80.' },
    { c: 'vel', q: 'Un ómnibus interprovincial de pasajeros circula por carretera sin señalización de velocidad. Su máximo es:', o: ['80 km/h', '90 km/h', '100 km/h', '110 km/h'], a: 1, e: 'Los vehículos de transporte de pasajeros tienen un máximo de 90 km/h en carretera, por debajo de los 100 km/h de los automóviles. Los vehículos de carga tienen aún menos: 80 km/h.', t: 'Cuanto más pesado, más bajo el límite.' },
    { c: 'vel', q: '¿Cuál es la velocidad máxima en caminos vecinales cuando no hay señalización?', o: ['40 km/h', '50 km/h', '60 km/h', '80 km/h'], a: 2, e: 'En caminos vecinales el máximo es 60 km/h. Suelen ser vías angostas, sin berma y a veces sin asfaltar, así que en la práctica muchas veces conviene ir más despacio.', t: 'Camino vecinal: 60 km/h.' },
    { c: 'seg', q: 'Según el Código Penal, un conductor particular comete delito de conducción en estado de ebriedad cuando su alcoholemia supera:', o: ['0,25 g/l', '0,5 g/l', '0,8 g/l', '1,0 g/l'], a: 1, e: 'El artículo 274 del Código Penal fija el límite en 0,5 gramos de alcohol por litro de sangre para conductores en general. Superarlo es delito y, además, infracción muy grave con multa, retención del vehículo y suspensión o cancelación de la licencia.', t: 'Particular: más de 0,5 g/l es delito.' },
    { c: 'seg', q: 'Para un conductor que presta servicio de transporte público de pasajeros o de carga, ¿desde qué alcoholemia se configura el delito?', o: ['0,0 g/l', 'Más de 0,25 g/l', 'Más de 0,3 g/l', 'Más de 0,5 g/l'], a: 1, e: 'Para quienes prestan servicio de transporte público de pasajeros, mercancías o carga, el límite es la mitad: 0,25 g/l. La responsabilidad es mayor porque llevan vidas ajenas o cargas peligrosas.', t: 'Profesional: la mitad, 0,25 g/l.' },
    { c: 'lic', q: 'En el sistema de licencias por puntos, ¿qué acumulación provoca la suspensión de la licencia?', o: ['50 puntos en 12 meses', '100 puntos en 24 meses', '100 puntos en 12 meses', '150 puntos en 36 meses'], a: 1, e: 'Si acumulas 100 puntos firmes en un periodo de 24 meses, la licencia se suspende. Los puntos se suman con cada infracción firme según su gravedad, y las más graves pueden llevar directamente a la suspensión o cancelación.', t: '100 puntos en 24 meses = suspensión.' },
    { c: 'pri', q: 'El semáforo te da luz verde, pero un efectivo de la Policía de Tránsito te hace la señal de detenerte. ¿Qué haces?', o: ['Sigo, porque el semáforo tiene prioridad', 'Me detengo: las indicaciones del policía prevalecen sobre el semáforo y las señales', 'Toco la bocina para que el policía vea que tengo verde', 'Sigo solo si no hay peatones'], a: 1, e: 'El orden de prevalencia es: primero las indicaciones del policía, luego los semáforos, después las señales verticales y al final las marcas en la calzada. El policía puede estar dando paso a una emergencia o gestionando un desvío que tú no ves.', t: 'Policía > semáforo > señal > marca en el piso.' },
    { c: 'pri', q: 'Dos vehículos llegan al mismo tiempo a una intersección no regulada de vías de igual jerarquía. ¿Quién tiene preferencia?', o: ['El que viene por la izquierda', 'El que se aproxima por la derecha', 'El de mayor tamaño', 'El que va a seguir de frente'], a: 1, e: 'En una intersección sin semáforo, señales ni policía, pasa primero quien ingresó antes; si llegan a la vez, tiene preferencia el vehículo que se aproxima por la derecha. Tener la preferencia no te autoriza a entrar sin mirar.', t: 'Igual jerarquía y llegada simultánea: derecha.' },
    { c: 'pri', q: 'Llegas por un jirón a una avenida, sin semáforo ni señal. Un auto se acerca por la avenida, por tu izquierda. ¿Quién pasa primero?', o: ['Yo, porque vengo por su derecha', 'El auto de la avenida, porque circula por la vía preferencial', 'El primero que toque la bocina', 'Ambos a la vez, con precaución'], a: 1, e: 'La regla de la derecha solo se aplica entre vías de igual jerarquía. La avenida es preferencial frente a un jirón o una calle, así que quien viene del jirón cede el paso aunque el otro vehículo llegue por su izquierda. Es una trampa típica del examen.', t: 'Primero la jerarquía de la vía; después la derecha.' },
    { c: 'pri', q: 'Vas a ingresar a un óvalo. ¿Quién tiene preferencia?', o: ['Yo, porque ingreso por la derecha', 'Los vehículos que ya circulan dentro del óvalo', 'El vehículo más grande', 'El que vaya a tomar la salida más cercana'], a: 1, e: 'En óvalos y rotondas tienen prioridad los vehículos que ya circulan dentro. Antes de entrar reduce, cede el paso y busca un espacio seguro. Para salir, ubícate con anticipación en el carril exterior y señaliza a la derecha.', t: 'Quien está dentro del óvalo, pasa primero.' },
    { c: 'pri', q: 'En una pendiente angosta donde no pueden pasar dos vehículos a la vez, ¿quién tiene preferencia?', o: ['El que baja', 'El que sube', 'El vehículo más liviano', 'El que llegó primero al tramo, suba o baje'], a: 1, e: 'Tiene preferencia el vehículo que sube, porque detenerse y volver a arrancar en subida es más difícil y riesgoso. El que baja debe detenerse en un ensanche o retroceder si hace falta.', t: 'En pendiente angosta, manda el que sube.' },
    { c: 'sen', q: 'En Lima ves el sardinel (borde de la vereda) pintado de amarillo. ¿Qué indica?', o: ['Zona de carga y descarga libre', 'Zona rígida: prohibido estacionar', 'Paradero de taxis', 'Estacionamiento para personas con discapacidad'], a: 1, e: 'El sardinel amarillo marca una zona rígida, donde está prohibido estacionar. Suele estar cerca de esquinas, paraderos, hidrantes o accesos de emergencia. Estacionar ahí es infracción y el vehículo puede terminar en el depósito.', t: 'Sardinel amarillo = zona rígida.' },
    { c: 'sen', q: 'Una línea blanca continua separa dos carriles que van en el mismo sentido. ¿Qué significa?', o: ['Que puedes cambiar de carril si usas la direccional', 'Que está prohibido cruzarla para cambiar de carril', 'Que el carril izquierdo es exclusivo para buses', 'Que estás saliendo de la ciudad'], a: 1, e: 'Las líneas blancas separan carriles del mismo sentido; las amarillas, sentidos opuestos. Si la línea es continua, no puedes cruzarla. Suele aparecer antes de intersecciones, puentes o túneles, donde cambiar de carril es peligroso.', t: 'Blanca = mismo sentido. Amarilla = sentido contrario.' },
    { c: 'pri', q: 'En una carretera de doble sentido el eje tiene una línea amarilla continua y otra discontinua. La discontinua está de tu lado. ¿Puedes adelantar?', o: ['No, nunca se puede cruzar una línea amarilla', 'Sí, si la maniobra es segura, porque la discontinua está de tu lado', 'Sí, pero solo de noche', 'Solo si adelantas a un vehículo de carga'], a: 1, e: 'Se lee la línea más cercana a ti. Si de tu lado es discontinua, puedes adelantar con visibilidad y espacio suficiente; quien tiene la continua de su lado no puede. Aun así, sigue prohibido adelantar en curvas, puentes, túneles, intersecciones y cruces ferroviarios.', t: 'Manda la línea de tu lado.' },
    { c: 'lic', q: '¿A quién cubre el SOAT cuando ocurre un accidente de tránsito?', o: ['Solo a los ocupantes, si el conductor no tuvo la culpa', 'A toda persona afectada, ocupante o peatón, por lesiones o muerte, sin importar la culpa', 'A los daños materiales de los vehículos', 'Solo al propietario del vehículo'], a: 1, e: 'El Seguro Obligatorio de Accidentes de Tránsito cubre a las personas: gastos médicos, incapacidad, muerte y sepelio, tanto de ocupantes como de peatones, sin investigar quién tuvo la culpa. No cubre daños materiales. Circular sin SOAT vigente es una infracción muy grave.', t: 'SOAT cubre personas, no fierros.' },
    { c: 'lic', q: 'En un control policial, además de tu DNI, ¿qué debes poder acreditar?', o: ['Solo la licencia de conducir', 'Licencia de conducir y tarjeta de identificación vehicular, con SOAT e inspección técnica vigentes', 'Tarjeta de propiedad notarial y recibo del impuesto vehicular', 'Licencia y constancia de domicilio'], a: 1, e: 'Debes portar tu licencia y la tarjeta de identificación vehicular, y el vehículo debe tener SOAT e Inspección Técnica Vehicular vigentes cuando corresponda. Varias de estas constancias hoy son electrónicas y la policía las verifica en línea, pero tienen que estar vigentes.', t: 'Licencia, tarjeta del vehículo, SOAT, revisión técnica.' },
    { c: 'lic', q: 'Un vehículo tiene el certificado de Inspección Técnica Vehicular vencido. ¿Qué dice la norma?', o: ['Puede circular hasta la siguiente fecha de revisión', 'No debe circular por la vía pública; hacerlo es una infracción', 'Solo puede circular dentro de su distrito', 'Puede circular si tiene SOAT vigente'], a: 1, e: 'La inspección técnica certifica que el vehículo está en condiciones de circular con seguridad. Con el certificado vencido no puedes usarlo en la vía pública. Tener SOAT no reemplaza la revisión técnica: son obligaciones distintas.', t: 'SOAT y revisión técnica son cosas distintas.' },
    { c: 'con', q: 'Circulas por el carril central de una avenida de tres carriles y se acerca por detrás una ambulancia con sirena y luces. ¿Qué haces?', o: ['Freno en mi carril para que me esquive', 'Señalizo, me desplazo hacia la derecha y me detengo si hace falta para dejarle libre el paso', 'Acelero para no estorbar', 'Paso al carril izquierdo porque es el más rápido'], a: 1, e: 'Los vehículos de emergencia con sirena y luces tienen preferencia. Lo correcto es señalizar, orillarte hacia la derecha de forma progresiva y detenerte si hace falta. Frenar en seco en tu carril o hacer maniobras bruscas puede causar un choque.', t: 'Ambulancia: a la derecha, sin frenazos.' },
    { c: 'pri', q: '¿Qué debes hacer ante un semáforo con luz roja intermitente?', o: ['Pasar con precaución sin detenerte', 'Detenerte por completo y continuar cuando sea seguro, como ante un PARE', 'Esperar a que cambie a verde', 'Ceder el paso solo a los peatones'], a: 1, e: 'La roja intermitente equivale a un PARE: detención total y luego avanzas cuando sea seguro. La amarilla intermitente, en cambio, indica precaución: reduces y cruzas atento, sin obligación de detenerte.', t: 'Roja intermitente = PARE. Amarilla intermitente = precaución.' },
    { c: 'pri', q: 'El semáforo está en rojo, pero se enciende una flecha verde hacia la derecha. ¿Qué puedes hacer?', o: ['Seguir de frente con precaución', 'Girar a la derecha, cediendo el paso a los peatones que estén cruzando', 'Girar a la derecha sin detenerte por nada', 'Nada: el rojo prevalece sobre la flecha'], a: 1, e: 'La flecha verde autoriza el movimiento que indica, aunque la luz circular esté en rojo. Igual debes ceder el paso a los peatones que ya están cruzando la vía a la que ingresas.', t: 'La flecha habilita solo su dirección.' },
    { c: 'pri', q: 'Hay visibilidad suficiente y la línea central es discontinua. ¿En cuál de estos lugares SÍ podrías adelantar?', o: ['Sobre un puente', 'En una curva', 'En una recta, lejos de intersecciones y cruces', 'En un cruce ferroviario a nivel'], a: 2, e: 'Está prohibido adelantar en curvas, puentes, túneles, intersecciones, cruces ferroviarios y zonas de visibilidad reducida. Solo puedes hacerlo en tramos rectos con visibilidad, con la línea discontinua de tu lado y sin vehículos que vengan de frente a una distancia peligrosa.', t: 'Curva, puente, túnel, cruce: nunca adelantes.' },
    { c: 'pri', q: '¿En qué caso está permitido adelantar por la derecha?', o: ['Nunca, bajo ninguna circunstancia', 'Cuando el vehículo de adelante señalizó que gira a la izquierda y hay espacio suficiente', 'Cuando el de adelante va lento', 'Por la berma, si está libre'], a: 1, e: 'Se adelanta por la izquierda. Por la derecha solo cuando el vehículo de adelante indicó que va a girar a la izquierda, o en vías de varios carriles en el mismo sentido con tránsito en filas. Usar la berma para adelantar está prohibido.', t: 'La berma nunca es un carril para adelantar.' },
    { c: 'pri', q: 'Otro vehículo te está adelantando en carretera. ¿Qué debes hacer?', o: ['Acelerar para no quedar atrás', 'Mantenerte a la derecha de tu carril y no aumentar la velocidad', 'Frenar bruscamente para dejarlo pasar', 'Encender las luces altas para avisarle'], a: 1, e: 'Quien es adelantado debe facilitar la maniobra: se mantiene a la derecha y no aumenta la velocidad. Acelerar mientras te adelantan deja al otro vehículo en el carril contrario más tiempo y es una de las causas de choques frontales.', t: 'Si te adelantan, no aceleres.' },
    { c: 'con', q: '¿Cuándo debes usar las luces intermitentes de emergencia?', o: ['Para estacionar un momento en doble fila', 'Cuando el vehículo está detenido en la vía por una emergencia o representa un peligro', 'Para indicar que sigues de frente en una intersección', 'Mientras avanzas con lluvia en la ciudad'], a: 1, e: 'Las intermitentes de emergencia avisan que el vehículo está detenido y es un peligro: avería, accidente o una detención obligada. No autorizan a estacionar en doble fila ni sirven como “direccional para seguir recto”.', t: 'Intermitentes = vehículo detenido por emergencia.' },
    { c: 'con', q: '¿En cuál de estos casos está prohibido usar la bocina?', o: ['Para evitar un accidente inminente', 'Frente a un hospital, o para llamar a alguien o apurar a otro conductor', 'En una curva sin visibilidad de carretera, para advertir tu presencia', 'Para advertir a un peatón distraído que está en peligro'], a: 1, e: 'La bocina solo se usa para prevenir un accidente. Está prohibido usarla de manera innecesaria, para llamar a alguien o apurar a otros, y en zonas de hospitales. En carretera, advertir tu presencia en una curva cerrada sin visibilidad es un uso preventivo aceptado.', t: 'La bocina previene, no apura.' },
    { c: 'seg', q: 'Un niño de 9 años viaja en un automóvil particular. ¿Dónde debe ir?', o: ['En el asiento delantero, con cinturón', 'En el asiento posterior, con el sistema de retención o cinturón adecuado a su talla', 'En brazos de un adulto en el asiento delantero', 'Donde haya espacio, si el viaje es corto'], a: 1, e: 'Los menores de 12 años deben viajar en los asientos posteriores, con un sistema de retención o un cinturón adaptado a su tamaño. En un choque, el airbag delantero puede causar lesiones graves a un niño.', t: 'Menores de 12: atrás.' },
    { c: 'seg', q: '¿Quiénes están obligados a usar el cinturón de seguridad?', o: ['Solo el conductor', 'El conductor y el copiloto', 'El conductor y todos los ocupantes de asientos que tengan cinturón', 'Todos, pero solo en carretera'], a: 2, e: 'El uso del cinturón es obligatorio para el conductor y para todos los ocupantes en los asientos que lo tengan, en ciudad y en carretera. Un pasajero trasero sin cinturón puede salir proyectado contra los de adelante.', t: 'Todos los asientos, siempre.' },
    { c: 'seg', q: 'Estás conduciendo y suena tu celular. ¿Qué indica el Reglamento?', o: ['Puedes contestar si vas a menos de 30 km/h', 'Está prohibido manipularlo mientras conduces; es una infracción', 'Puedes leer mensajes, pero no escribirlos', 'Solo está prohibido en carretera'], a: 1, e: 'Conducir manipulando el celular u otro dispositivo es una infracción, sin excepción de velocidad ni de tipo de vía. Leer un mensaje te quita la vista del camino varios segundos: a 60 km/h, en 3 segundos recorres 50 metros sin mirar.', t: 'Celular en la mano = infracción.' },
    { c: 'lic', q: '¿Cuál es la edad mínima para obtener la licencia clase A categoría I?', o: ['16 años', '17 años', '18 años', '21 años'], a: 2, e: 'Para la licencia A-I necesitas tener 18 años cumplidos, además de aprobar el examen médico, el de reglas de tránsito y el de manejo. Las categorías profesionales piden más edad y años de experiencia con la licencia anterior.', t: 'A-I: 18 años.' },
    { c: 'lic', q: 'Quieres trabajar como taxista. ¿Qué licencia necesitas como mínimo?', o: ['A-I', 'A-IIa', 'A-IIb', 'A-IIIc'], a: 1, e: 'La A-I es para vehículos de uso particular. Para taxis, ambulancias y transporte de personal se requiere la A-IIa. Las A-IIb y A-III son para vehículos más grandes, como microbuses, ómnibus y camiones.', t: 'Taxi = A-IIa.' },
    { c: 'sen', q: 'Una señal de tránsito con fondo naranja indica:', o: ['Un servicio turístico', 'Trabajos en la vía o un desvío temporal', 'Una zona escolar', 'Un límite de velocidad'], a: 1, e: 'Las señales naranjas son temporales y avisan de obras, desvíos o personal trabajando. Mientras estén colocadas, son de cumplimiento obligatorio igual que las permanentes, y si contradicen a una permanente, prevalecen.', t: 'Naranja = obra o desvío.' },
    { c: 'sen', s: 'pare', q: 'Llegas a esta señal y la línea de parada está borrada. ¿Dónde debes detenerte?', o: ['Sobre el crucero peatonal, para ver mejor', 'Antes del crucero peatonal o, si no lo hay, antes de la intersección, donde tengas visibilidad', 'No es necesario detenerse si no hay línea', 'Después de la intersección'], a: 1, e: 'Con o sin línea pintada, la señal PARE obliga a detenerse por completo. Te detienes antes del crucero peatonal; si no lo hay, antes de entrar a la intersección. Si desde ahí no ves, avanzas despacio hasta tener visibilidad, sin invadir el cruce.', t: 'Sin línea: antes del crucero.' },
    { c: 'sen', s: 'ceda', q: 'Ante esta señal, y sin vehículos en la vía preferente, ¿qué haces?', o: ['Me detengo siempre tres segundos', 'Reduzco la velocidad, verifico que la vía esté libre y continúo sin detenerme', 'Acelero para cruzar rápido', 'Espero a que pase al menos un vehículo'], a: 1, e: 'CEDA EL PASO no exige detenerse si la vía preferente está libre. Debes reducir y verificar; si viene alguien, te detienes. Detenerte sin necesidad no es una falta, pero no es lo que pide la señal.', t: 'Ceda: verifica; PARE: detente siempre.' },
    { c: 'sen', s: 'noEst', q: 'Con esta señal, ¿puedes detenerte un momento para que baje un pasajero?', o: ['No, está prohibido detenerse por completo', 'Sí: detenerse momentáneamente está permitido; lo prohibido es estacionar', 'Solo si dejas las luces de emergencia hasta 10 minutos', 'Solo de noche'], a: 1, e: 'Estacionar es dejar el vehículo detenido más allá de lo necesario para subir o bajar personas o cosas. Detenerse es momentáneo, con el conductor al volante. Esta señal prohíbe estacionar, no detenerse.', t: 'Detenerse no es estacionar.' },
    { c: 'sen', s: 'gasolina', q: 'Esta señal informativa indica:', o: ['Taller mecánico', 'Grifo o estación de combustible', 'Prohibido abastecer combustible', 'Zona industrial'], a: 1, e: 'Las señales de servicios tienen fondo azul y un recuadro blanco con el símbolo. Esta indica un grifo. Las señales informativas orientan, no obligan.', t: 'Azul con recuadro blanco = servicio.' },
    { c: 'pri', q: 'Una persona con bastón blanco empieza a cruzar fuera del crucero peatonal. ¿Qué haces?', o: ['Toco la bocina para que regrese', 'Me detengo y le cedo el paso: tiene prioridad', 'Paso por detrás de ella sin detenerme', 'Sigo, porque no está en el crucero'], a: 1, e: 'El bastón blanco identifica a una persona con discapacidad visual y debes cederle el paso en cualquier punto donde cruce. Tocar la bocina puede desorientarla. Detente a una distancia prudente y espera.', t: 'Bastón blanco: siempre cede.' },
    { c: 'pri', q: 'Con luz verde giras a la derecha y un peatón está cruzando la calle a la que vas a ingresar. ¿Quién tiene preferencia?', o: ['Yo, porque tengo luz verde', 'El peatón', 'El primero que llegue', 'Depende del ancho de la calle'], a: 1, e: 'Al girar, siempre cedes el paso a los peatones que cruzan la vía a la que ingresas, aunque tengas luz verde. Ellos también tienen luz verde para cruzar en paralelo a ti.', t: 'Al girar, el peatón primero.' },
    { c: 'con', q: 'En la Carretera Central te cubre una neblina densa. ¿Qué luces usas?', o: ['Altas, para ver más lejos', 'Bajas y neblineros si los tienes, reduciendo la velocidad', 'Solo intermitentes de emergencia mientras avanzas', 'Ninguna, para no deslumbrar'], a: 1, e: 'Las luces altas rebotan en la neblina y te deslumbran. Usa luces bajas y neblineros, reduce la velocidad y aumenta la distancia con el vehículo de adelante. Las intermitentes son para un vehículo detenido, no para uno en marcha.', t: 'Neblina: bajas y neblineros.' },
    { c: 'con', q: 'Te acercas a un cruce ferroviario a nivel. El vehículo de adelante se detuvo justo después de las vías y no hay espacio para ti al otro lado. ¿Qué haces?', o: ['Cruzo y espero sobre los rieles', 'Espero antes del cruce hasta que haya espacio para que mi vehículo quede fuera de las vías', 'Toco la bocina para que avance', 'Cruzo por el carril contrario'], a: 1, e: 'Nunca te detengas sobre las vías. Entra al cruce solo si hay espacio del otro lado para que tu vehículo quede completamente fuera. El tren tiene preferencia y necesita cientos de metros para frenar.', t: 'Sin salida asegurada, no entres al cruce.' },
    { c: 'con', q: 'Manejando de noche por la Panamericana empiezas a cabecear de sueño. ¿Qué es lo más seguro?', o: ['Bajar la ventana y subir el volumen', 'Tomar café y seguir hasta el destino', 'Detenerte en un lugar seguro, fuera de la vía, y descansar', 'Acelerar para llegar antes'], a: 2, e: 'La única solución para el sueño es dormir. El aire frío, la música o el café solo disimulan el cansancio unos minutos. Un microsueño de 3 segundos a 100 km/h equivale a recorrer más de 80 metros sin control.', t: 'Contra el sueño, solo funciona dormir.' },
    { c: 'con', q: 'Estacionas en una calle en bajada que tiene vereda. ¿Cómo dejas las ruedas delanteras?', o: ['Rectas', 'Giradas hacia la vereda, con freno de mano y cambio puesto', 'Giradas hacia la pista', 'Da igual si usas el freno de mano'], a: 1, e: 'En bajada con vereda, gira las ruedas hacia la vereda: si el vehículo se mueve, el sardinel lo detiene. En subida con vereda, gíralas hacia la pista. Siempre con freno de mano y una marcha puesta.', t: 'Bajada: hacia la vereda. Subida: hacia la pista.' },
    { c: 'con', q: 'En condiciones normales de pista seca, ¿qué distancia mínima recomiendan los manuales de manejo defensivo con el vehículo de adelante?', o: ['Un metro por cada 10 km/h', 'Al menos 3 segundos', 'La necesaria para leer su placa', 'Medio segundo si tienes buenos frenos'], a: 1, e: 'La regla de los 3 segundos funciona a cualquier velocidad: cuando el vehículo de adelante pase un punto fijo, cuenta “mil uno, mil dos, mil tres”. Si llegas antes al punto, vas muy cerca. Con lluvia, neblina o de noche, duplica esa distancia.', t: 'Mil uno, mil dos, mil tres.' },
    { c: 'sen', s: 'escolar', q: '¿Qué indica esta señal y qué debes hacer?', o: ['Parque infantil; puedes estacionar', 'Zona escolar: máximo 30 km/h y atento a niños', 'Cruce de peatones adultos; ninguna acción especial', 'Prohibido el paso de peatones'], a: 1, e: 'El rombo amarillo con dos niños anuncia una zona escolar. Debes reducir a 30 km/h como máximo y estar listo para detenerte. Los niños son bajos, difíciles de ver entre autos estacionados e impredecibles.', t: 'Rombo con niños = 30 km/h.' },
    { c: 'sen', s: 'reductor', q: 'Esta señal preventiva anuncia:', o: ['Una pendiente pronunciada', 'Un resalto o reductor de velocidad', 'Un puente angosto', 'Un badén con agua'], a: 1, e: 'Anuncia un resalto o rompemuelles. Reduce la velocidad antes de llegar y pásalo en línea recta. Pasarlo rápido daña la suspensión y puede hacerte perder el control.', t: 'Resalto: despacio y recto.' }
  ]
});
</script>
<script>
window.ADM.REGIONS.push({

  side: 'derecha', units: 'km/h',

  signTypes: { reg: 'Reglamentarias', prev: 'Preventivas', info: 'Informativas' },

  signs: [

    { k: 'ceda', type: 'reg', name: 'Ceda el paso', meaning: 'Reduce y cede a la vía preferente; detente solo si hace falta.', tip: 'En Brasil: “Dê a preferência”.' },
    { k: 'vel60', type: 'reg', name: 'Velocidad máxima 60 km/h', meaning: 'No superes 60 km/h desde la señal.', tip: 'Chile y Colombia bajaron el límite urbano genérico a 50 km/h.' },
    { k: 'noEst', type: 'reg', name: 'Prohibido estacionar', meaning: 'Puedes detenerte un momento, pero no estacionar.', tip: 'Brasil usa la letra E cruzada igual que Perú y Colombia.' },
    { k: 'noU', type: 'reg', name: 'Prohibido girar en U', meaning: 'No puedes dar la vuelta para regresar.', tip: 'Busca un retorno señalizado.' },
    { k: 'curva', type: 'prev', name: 'Curva a la derecha', meaning: 'Reduce antes de entrar en la curva.', tip: 'Frena en la recta.' },
    { k: 'peatones', type: 'prev', name: 'Peatones', meaning: 'Zona de cruce frecuente de peatones.', tip: 'Prepárate para detenerte.' },
    { k: 'escolar', type: 'prev', name: 'Zona escolar', meaning: 'Escuela cercana; en Colombia el máximo es 30 km/h.', tip: 'Niños: impredecibles y difíciles de ver.' },
    { k: 'semaforo', type: 'prev', name: 'Semáforo adelante', meaning: 'Semáforo próximo, quizá oculto.', tip: 'Anticipa la frenada.' },
    { k: 'reductor', type: 'prev', name: 'Lomo de toro / resalto', meaning: 'Reductor de velocidad adelante. En Chile “lomo de toro”, en Brasil “lombada”.', tip: 'Cada país lo llama distinto; la señal es la misma.' },
    { k: 'cruce', type: 'prev', name: 'Intersección', meaning: 'Cruce de vías adelante.', tip: 'Sin señales, prioridad de la derecha.' },
    { k: 'estrecho', type: 'prev', name: 'Angostamiento', meaning: 'La calzada se estrecha.', tip: 'Cede a quien ya entró al tramo.' },
    { k: 'hospital', type: 'info', name: 'Hospital', meaning: 'Centro de salud cercano.', tip: 'Evita la bocina.' },
    { k: 'gasolina', type: 'info', name: 'Combustible', meaning: 'Estación de servicio: bencinera en Chile, posto en Brasil.', tip: 'Mismo símbolo en toda la región.' },
    { k: 'restaurante', type: 'info', name: 'Restaurante', meaning: 'Servicio de comida próximo.', tip: 'Descansa cada 2 horas de manejo.' },
    { k: 'destino', type: 'info', name: 'Destino', meaning: 'Dirección y distancia a un lugar.', tip: 'Ubícate en el carril con anticipación.' }
  ],
  facts: [
    { title: 'Alcohol', rows: [['Chile', 'Bajo la influencia: 0,3 a 0,8 g/l. Estado de ebriedad: más de 0,8 g/l'], ['Colombia', 'Sanciona desde 20 mg por 100 ml de sangre (0,2 g/l)'], ['Argentina', 'Alcohol cero en jurisdicción nacional desde 2023 (Ley 27.714)'], ['Brasil', 'Tolerancia cero; desde 0,6 g/l (0,3 mg/l en aire) es delito'], ['Uruguay', 'Alcohol cero para todos los conductores (Ley 19.360)']] },
    { title: 'Velocidades urbanas', rows: [['Chile', '50 km/h genérico desde 2018'], ['Colombia', '50 km/h urbano y 30 km/h en zonas escolares (Ley 2251 de 2022)'], ['Argentina', 'Calles 40 km/h, avenidas 60 km/h'], ['Argentina, rutas', 'Autos 110 km/h, autopistas 130 km/h']] },
    { title: 'Luces de día', rows: [['Argentina', 'Luces bajas obligatorias en rutas, de día y de noche'], ['Brasil', 'Faróis baixos de día en rodovias de pista simple']] },
    { title: 'Seguros y trámites', rows: [['Colombia', 'SOAT obligatorio; la multa se notifica con un “comparendo”'], ['Chile', 'SOAP obligatorio y permiso de circulación anual'], ['Colombia, ciudades', 'Pico y placa: restricción por último dígito de la placa']] },
    { title: 'Licencia por puntos', rows: [['Argentina', '20 puntos'], ['Brasil', 'Suspensión con 20, 30 o 40 puntos en 12 meses, según cuántas infracciones gravíssimas tengas']] }
  ],
  raw: [
    { c: 'seg', q: 'En Colombia, ¿desde qué nivel de alcohol en sangre se sanciona a un conductor?', o: ['Desde 20 mg de etanol por 100 ml de sangre', 'Desde 50 mg por 100 ml', 'Desde 80 mg por 100 ml', 'Solo si hay un accidente'], a: 0, e: 'La Ley 1696 de 2013 sanciona desde 20 mg/100 ml (grado cero), es decir, 0,2 g/l. Las sanciones suben por grados e incluyen multas altas, suspensión o cancelación de la licencia e inmovilización del vehículo.', t: 'Colombia: desde 0,2 g/l ya hay sanción.' },
    { c: 'seg', q: 'En Chile, un conductor con 0,6 g/l de alcohol en la sangre está:', o: ['Dentro de lo permitido', 'Bajo la influencia del alcohol', 'En estado de ebriedad', 'Exento si no causó daño'], a: 1, e: 'La Ley de Tolerancia Cero define “bajo la influencia” entre 0,3 y 0,8 g/l, y “estado de ebriedad” por encima de 0,8 g/l. Ambas se sancionan, con penas mucho más duras para la ebriedad, sobre todo si hay víctimas (Ley Emilia).', t: 'Chile: 0,3 influencia; 0,8 ebriedad.' },
    { c: 'seg', q: 'Entre estos países, ¿cuál tolera el nivel de alcohol más alto sin sanción para un conductor particular?', o: ['Uruguay', 'Brasil', 'Chile', 'Argentina (en jurisdicción nacional)'], a: 2, e: 'Chile empieza a sancionar desde 0,3 g/l, así que por debajo no hay infracción. Uruguay y Argentina (en jurisdicción nacional) aplican alcohol cero, y Brasil tiene tolerancia cero con sanción administrativa ante cualquier cantidad.', t: 'Uruguay, Brasil y Argentina: cero.' },
    { c: 'seg', q: 'En Brasil, ¿qué ocurre si un conductor da 0,7 g/l de alcohol en sangre?', o: ['Solo recibe una advertencia', 'Comete una infracción leve', 'Comete delito de tránsito, además de la infracción gravíssima', 'Nada, si no causó accidente'], a: 2, e: 'La Lei Seca aplica tolerancia cero: cualquier cantidad es infracción gravíssima con multa y suspensión del derecho a conducir. Desde 0,6 g/l de sangre (o 0,3 mg/l en aire) además es delito.', t: 'Brasil: desde 0,6 g/l es delito.' },
    { c: 'seg', q: 'Desde 2023, ¿qué tasa de alcohol se permite al conducir en rutas nacionales de Argentina?', o: ['0,5 g/l', '0,2 g/l', '0,0 g/l: alcohol cero', '0,8 g/l'], a: 2, e: 'La Ley 27.714 estableció alcohol cero para conducir en jurisdicción nacional. Antes, el límite general era 0,5 g/l. Varias provincias y ciudades ya tenían sus propias leyes de alcohol cero.', t: 'Argentina: alcohol cero en rutas nacionales.' },
    { c: 'vel', q: 'En Chile, ¿cuál es el límite genérico de velocidad en zona urbana?', o: ['40 km/h', '50 km/h', '60 km/h', '70 km/h'], a: 1, e: 'Desde 2018, Chile bajó el límite urbano genérico de 60 a 50 km/h. Las autoridades pueden fijar otros valores con señalización en vías específicas.', t: 'Chile urbano: 50.' },
    { c: 'vel', q: 'En Colombia, según la Ley 2251 de 2022, la velocidad máxima en zonas escolares y residenciales es:', o: ['20 km/h', '30 km/h', '40 km/h', '50 km/h'], a: 1, e: 'La llamada Ley Julián Esteban fijó 50 km/h como máximo en vías urbanas y 30 km/h en zonas escolares y residenciales.', t: 'Colombia: 50 urbano, 30 escolar.' },
    { c: 'vel', q: 'Según la Ley 24.449 de Argentina, ¿cuál es la velocidad máxima de un automóvil en autopista?', o: ['110 km/h', '120 km/h', '130 km/h', '140 km/h'], a: 2, e: 'La ley nacional fija 130 km/h en autopistas y 110 km/h en rutas para automóviles. En zona urbana son 40 km/h en calles y 60 km/h en avenidas.', t: 'Argentina: ruta 110, autopista 130.' },
    { c: 'vel', q: 'En Argentina, sin señalización especial, ¿cuál es la velocidad máxima en una calle urbana?', o: ['30 km/h', '40 km/h', '50 km/h', '60 km/h'], a: 1, e: 'En zona urbana, la Ley 24.449 fija 40 km/h en calles y 60 km/h en avenidas. Es la misma lógica que en Perú: calle o jirón 40, avenida 60.', t: 'Argentina urbana: calle 40, avenida 60.' },
    { c: 'con', q: 'En Argentina, ¿cuándo es obligatorio llevar encendidas las luces bajas en ruta?', o: ['Solo de noche', 'Solo con lluvia o niebla', 'Siempre, de día y de noche', 'Solo en túneles'], a: 2, e: 'La Ley 24.449 obliga a circular con luces bajas encendidas en rutas nacionales a toda hora. De día no es para ver, sino para que te vean, sobre todo los vehículos que vienen de frente.', t: 'Argentina en ruta: luces bajas siempre.' },
    { c: 'con', q: 'En Brasil, desde la reforma de 2020, ¿dónde es obligatorio usar faróis baixos (luces bajas) durante el día?', o: ['En todas las calles de la ciudad', 'En rodovias de pista simple (un carril por sentido)', 'Solo en autopistas duplicadas', 'En ningún caso'], a: 1, e: 'La Ley 14.071/2020 limitó la obligación de usar luces bajas de día a las rodovias de pista simple, fuera del perímetro urbano, donde el riesgo de choque frontal es mayor. Antes la exigencia abarcaba todas las rodovias.', t: 'Brasil: luces de día en rodovias de pista simple.' },
    { c: 'pri', q: 'En Argentina, en una intersección sin señalizar, ¿quién tiene prioridad?', o: ['El que viene por la izquierda', 'El que cruza desde la derecha', 'El que circula por la vía más ancha', 'El que llegue primero'], a: 1, e: 'La Ley 24.449 (art. 41) da prioridad absoluta a quien cruza desde la derecha, con algunas excepciones: vehículos de emergencia, vías de mayor jerarquía (como rutas y semiautopistas) y peatones en la senda peatonal.', t: 'Argentina: la derecha manda.' },
    { c: 'seg', q: 'En Argentina, ¿hasta qué edad deben viajar los niños en los asientos traseros?', o: ['Hasta los 6 años', 'Hasta los 10 años', 'Hasta los 14 años', 'No hay regla'], a: 1, e: 'La Ley 24.449 establece que los menores de 10 años deben viajar en el asiento trasero, con sistema de retención adecuado. En Chile y Perú el límite es 12 años.', t: 'Argentina: menores de 10 atrás. Chile y Perú: 12.' },
    { c: 'lic', q: 'En Chile, ¿cómo se llama el seguro obligatorio que cubre a las personas en accidentes de tránsito?', o: ['SOAT', 'SOAP', 'DPVAT', 'RC Obligatorio'], a: 1, e: 'En Chile es el SOAP (Seguro Obligatorio de Accidentes Personales), que se contrata junto al permiso de circulación. En Perú y Colombia se llama SOAT. Cubre a las personas, no los daños materiales.', t: 'Chile SOAP; Perú y Colombia SOAT.' },
    { c: 'lic', q: 'En Colombia, ¿cómo se llama la orden de citación que recibe un conductor por una infracción de tránsito?', o: ['Papeleta', 'Comparendo', 'Boleta', 'Multa directa'], a: 1, e: 'En Colombia se llama comparendo: la orden de presentarse ante la autoridad de tránsito por una presunta infracción. En Perú se usa “papeleta” y en Chile se habla de “parte” o citación al juzgado.', t: 'Colombia: comparendo. Perú: papeleta.' },
    { c: 'lic', q: 'En varias ciudades de Colombia, “pico y placa” es:', o: ['Un horario de peaje', 'Una restricción de circulación según el último dígito de la placa', 'Un impuesto anual', 'Un tipo de licencia'], a: 1, e: 'Es una medida para reducir la congestión: ciertos días y horarios no pueden circular los vehículos cuya placa termina en determinados dígitos. Las reglas cambian según la ciudad.', t: 'Pico y placa depende de la ciudad.' },
    { c: 'lic', q: 'En Brasil, con la Ley 14.071/2020, ¿con cuántos puntos se suspende la licencia si el conductor no tiene ninguna infracción gravíssima en 12 meses?', o: ['20 puntos', '30 puntos', '40 puntos', '50 puntos'], a: 2, e: 'El límite depende de las infracciones gravíssimas: 40 puntos si no tienes ninguna, 30 con una y 20 con dos o más, siempre en 12 meses.', t: 'Brasil: 40, 30 o 20 puntos.' },
    { c: 'lic', q: 'En Argentina, la Licencia Nacional de Conducir por puntos parte con:', o: ['12 puntos', '15 puntos', '20 puntos', '100 puntos'], a: 2, e: 'El sistema argentino de scoring parte con 20 puntos y descuenta según la infracción. Al llegar a cero, se inhabilita al conductor por un tiempo. Es la lógica inversa a Perú, donde los puntos se suman hasta llegar a 100.', t: 'Argentina descuenta; Perú suma.' },
    { c: 'seg', q: 'La Ley Emilia de Chile (2014) se aprobó para:', o: ['Bajar la velocidad urbana', 'Endurecer las penas a quien conduce ebrio y causa lesiones graves o la muerte, con cárcel efectiva', 'Exigir sillas para niños', 'Prohibir el celular'], a: 1, e: 'Lleva el nombre de Emilia Silva, una bebé que murió en un choque causado por un conductor ebrio. La ley establece al menos un año de cárcel efectiva para quien conduce en estado de ebriedad y causa lesiones gravísimas o la muerte.', t: 'Ley Emilia: ebriedad con víctimas = cárcel efectiva.' },
    { c: 'sen', s: 'pare', q: 'Viajas de Perú a Brasil en auto. ¿Qué texto tiene la señal octagonal roja en Brasil?', o: ['STOP', 'ALTO', 'PARE', 'PARADA'], a: 2, e: 'Brasil usa PARE, igual que Perú, Chile, Colombia y Argentina. México y buena parte de Centroamérica usan ALTO, y muchos países de Europa usan STOP. La forma octagonal es la misma en todos.', t: 'Octágono = detención total, diga lo que diga.' },
    { c: 'sen', s: 'reductor', q: 'Esta señal preventiva anuncia un reductor de velocidad. En Chile se le llama popularmente:', o: ['Muerto', 'Lomo de toro', 'Tope', 'Policía acostado'], a: 1, e: 'En Chile se le dice “lomo de toro”; en Colombia, “policía acostado” o “resalto”; en México, “tope”; en Brasil, “lombada”. Distintos nombres, la misma obligación: reducir la velocidad.', t: 'Mismo reductor, distinto nombre en cada país.' },
    { c: 'pri', q: 'En una rotonda de Chile o Colombia, ¿quién tiene la preferencia?', o: ['El que entra por la derecha', 'Los vehículos que ya circulan dentro de la rotonda', 'El vehículo de mayor tamaño', 'El que va a la salida más próxima'], a: 1, e: 'En la región la regla general es que quien circula dentro de la rotonda tiene preferencia sobre quien entra. Algunas rotondas tienen semáforos o señales propias, que siempre prevalecen.', t: 'Rotonda: preferencia de quien está dentro.' },
    { c: 'con', q: 'Con un vehículo con frenos ABS, en una frenada de emergencia debes:', o: ['Bombear el pedal repetidamente', 'Pisar a fondo, mantener la presión y esquivar con el volante', 'Usar el freno de mano', 'Soltar el freno al sentir vibración'], a: 1, e: 'El ABS evita que las ruedas se bloqueen, así que puedes seguir girando mientras frenas. La vibración en el pedal es normal. Bombear el freno era la técnica para autos sin ABS y con ABS alarga la frenada.', t: 'Con ABS: pisa fuerte y esquiva.' },
    { c: 'con', q: 'Con lluvia intensa el volante se pone ligero y el auto “flota” (hidroplaneo). ¿Qué haces?', o: ['Frenar a fondo', 'Girar fuerte el volante', 'Soltar suavemente el acelerador y mantener el volante recto, sin frenar de golpe', 'Acelerar para recuperar agarre'], a: 2, e: 'En el hidroplaneo las llantas pierden contacto con el pavimento. Un frenazo o un volantazo pueden cruzar el auto. Suelta el acelerador con suavidad y mantén la dirección hasta que las llantas vuelvan a agarrar.', t: 'Pie fuera del acelerador, volante quieto.' }
  ]
});
</script>
<script>
window.ADM.REGIONS.push({
  id: 'na', name: 'Norteamérica', code: 'US', country: 'Estados Unidos (California)',
  ref: 'California Driver Handbook (DMV) y California Vehicle Code. Cada estado tiene su propio código',
  side: 'derecha', units: 'mph y pies',
  exam: { official: 'Examen de conocimientos de California para mayores de 18: 36 preguntas, aprobar con 30. Otros estados usan formatos parecidos.', size: 24, officialSize: 36, minutes: 24, pass: 30 / 36 },
  caveat: 'En EE. UU. cada estado tiene su código. Se usa California como referencia. Las distancias van en pies y las velocidades en millas por hora; las explicaciones incluyen la conversión.',
  signTypes: { reg: 'Regulatory (reglamentarias)', prev: 'Warning (preventivas)', info: 'Guide (informativas)' },
  signLegend: { reg: 'Rectángulos blancos, STOP, YIELD y señales rojas de prohibición.', prev: 'Rombo amarillo; pentágono amarillo verdoso para escuelas; círculo amarillo para trenes.', info: 'Verde para destinos, azul para servicios, marrón para turismo.' },
  signs: [
    { k: 'stop', type: 'reg', name: 'STOP', meaning: 'Detención total en la línea; si no hay, antes del paso peatonal o de entrar al cruce.', tip: 'En un “4-way stop” pasa primero quien se detuvo primero.' },
    { k: 'yieldUS', type: 'reg', name: 'YIELD', meaning: 'Cede el paso: reduce y detente si hace falta.', tip: 'Triángulo rojo invertido con texto.' },
    { k: 'speedUS', type: 'reg', name: 'SPEED LIMIT 65', meaning: 'Máximo 65 mph (unos 105 km/h). Es el límite habitual en autopistas de California.', tip: 'En EE. UU. la velocidad va en un rectángulo blanco, no en un círculo.' },
    { k: 'doNotEnter', type: 'reg', name: 'DO NOT ENTER', meaning: 'Prohibido entrar: suele marcar la salida de una autopista o una calle de sentido contrario.', tip: 'Si la ves de frente, vas a entrar en contramano.' },
    { k: 'wrongWay', type: 'reg', name: 'WRONG WAY', meaning: 'Vas en sentido contrario. Detente y regresa con seguridad.', tip: 'Suele aparecer después de DO NOT ENTER.' },
    { k: 'noTurnRed', type: 'reg', name: 'NO TURN ON RED', meaning: 'Prohíbe girar con luz roja, algo que de otro modo está permitido tras detenerse.', tip: 'Sin esta señal, el giro a la derecha en rojo es legal.' },
    { k: 'schoolUS', type: 'prev', name: 'School zone / crossing', meaning: 'Escuela cercana o cruce escolar. Hasta 25 mph cuando hay niños.', tip: 'Es la única señal con forma de pentágono.' },
    { k: 'curva', type: 'prev', name: 'Curve ahead', meaning: 'Curva adelante. Reduce antes de entrar.', tip: 'A veces lleva una placa con la velocidad recomendada.' },
    { k: 'rrAdvance', type: 'prev', name: 'Railroad advance warning', meaning: 'Paso a nivel más adelante. Mira, escucha y prepárate para detenerte.', tip: 'Círculo amarillo con X y dos R.' },
    { k: 'crossbuck', type: 'reg', name: 'Railroad crossbuck', meaning: 'Ubicación del paso a nivel. Cede el paso al tren.', tip: 'Equivale a un YIELD para el tren.' },
    { k: 'peatones', type: 'prev', name: 'Pedestrian crossing', meaning: 'Cruce de peatones.', tip: 'El peatón tiene preferencia en cualquier cruce, marcado o no.' }
  ],
  facts: [
    { title: 'Velocidades (California)', rows: [['Máximo habitual en autopista', '65 mph (≈105 km/h); 70 mph donde se señaliza'], ['Carretera de 2 carriles sin división', '55 mph (≈88 km/h)'], ['Zona escolar con niños, zona residencial', '25 mph (≈40 km/h)'], ['Cruce sin visibilidad, callejón, paso a nivel sin visibilidad', '15 mph (≈24 km/h)'], ['Regla básica', 'Nunca más rápido de lo seguro para las condiciones']] },
    { title: 'Alcohol (BAC)', rows: [['21 años o más', '0,08 %'], ['Conductores comerciales', '0,04 %'], ['Menores de 21', '0,01 %']] },
    { title: 'Bordillos pintados', rows: [['Rojo', 'No detenerse, ni esperar, ni estacionar'], ['Amarillo', 'Solo carga y descarga, el tiempo indicado'], ['Blanco', 'Solo subir o bajar pasajeros o correo'], ['Verde', 'Estacionamiento por tiempo limitado'], ['Azul', 'Personas con discapacidad, con placa o permiso']] },
    { title: 'Distancias clave', rows: [['Señalizar antes de girar', '100 pies (≈30 m)'], ['Hidrante', 'No estacionar a menos de 15 pies (≈4,5 m)'], ['Luces altas', 'Bajarlas a 500 pies de quien viene y a 300 pies de quien sigues'], ['Ciclistas', 'Al menos 3 pies (≈0,9 m) al adelantar'], ['Carril central de giro a la izquierda', 'Máximo 200 pies dentro de él']] },
    { title: 'Niños y teléfono', rows: [['Menores de 2 años', 'Silla a contramarcha'], ['Menores de 8 años', 'Silla o elevador en el asiento trasero'], ['Conductores menores de 18', 'Prohibido usar el teléfono, incluso manos libres']] }
  ],
  raw: [
    { c: 'vel', q: 'La “Basic Speed Law” de California dice que:', o: ['Nunca puedes ir a menos de 55 mph en autopista', 'Nunca debes conducir más rápido de lo seguro para las condiciones, aunque vayas bajo el límite', 'Puedes superar el límite en 5 mph', 'El límite solo aplica de día'], a: 1, e: 'Puedes recibir una multa yendo bajo el límite señalizado si la velocidad no es segura por lluvia, niebla, tráfico o visibilidad. El límite es un máximo para condiciones ideales.', t: 'Bajo el límite también puedes ir demasiado rápido.' },
    { c: 'vel', q: 'En una carretera de dos carriles sin división y sin señal de velocidad, ¿cuál es el máximo en California?', o: ['45 mph', '55 mph', '65 mph', '70 mph'], a: 1, e: 'El máximo es 55 mph (unos 88 km/h) en carreteras de dos carriles sin división, salvo que una señal indique otro valor. El de 65 mph es para autopistas.', t: 'Dos carriles sin división: 55 mph.' },
    { c: 'vel', q: 'A menos de 500 a 1.000 pies de una escuela, con niños presentes, el límite es:', o: ['15 mph', '20 mph', '25 mph', '35 mph'], a: 2, e: 'Cuando hay niños presentes, el límite cerca de escuelas es 25 mph (unos 40 km/h), salvo que otra señal indique menos. Algunas zonas escolares tienen 15 mph señalizados.', t: 'Escuela con niños: 25 mph.' },
    { c: 'vel', q: 'Te acercas a una intersección sin semáforo ni señales donde no puedes ver 100 pies hacia ambos lados en los últimos 100 pies. ¿Límite?', o: ['10 mph', '15 mph', '20 mph', '25 mph'], a: 1, e: 'En una intersección “ciega” el límite es 15 mph (unos 24 km/h). El mismo límite rige en callejones y en pasos a nivel donde no ves las vías 400 pies hacia ambos lados.', t: 'Cruce ciego, callejón o vía férrea sin visibilidad: 15 mph.' },
    { c: 'pri', q: '¿A qué distancia antes de girar debes empezar a señalizar?', o: ['50 pies', '100 pies', '200 pies', '300 pies'], a: 1, e: 'Debes señalizar durante los últimos 100 pies (unos 30 m) antes de girar o cambiar de carril. En autopista conviene hacerlo con más antelación.', t: 'Señaliza 100 pies antes.' },
    { c: 'pri', q: 'Estás detenido en un semáforo en rojo y quieres girar a la derecha. No hay ninguna señal. ¿Qué dice la ley?', o: ['Está prohibido girar en rojo', 'Puedes girar tras detenerte por completo y ceder el paso a peatones y vehículos', 'Puedes girar sin detenerte si no viene nadie', 'Solo si el semáforo parpadea'], a: 1, e: 'En California se permite girar a la derecha con luz roja después de una detención completa, cediendo el paso, salvo que una señal NO TURN ON RED lo prohíba. Con flecha roja, en cambio, está prohibido.', t: 'Derecha en rojo: sí, tras detenerte; con flecha roja, no.' },
    { c: 'pri', q: '¿En qué caso se permite girar a la izquierda con luz roja?', o: ['Nunca', 'Desde una calle de sentido único hacia otra calle de sentido único, tras detenerte', 'Siempre que no venga nadie', 'Solo de noche'], a: 1, e: 'Se permite girar a la izquierda con roja solo de una calle de sentido único a otra calle de sentido único que va hacia la izquierda, tras detenerte por completo y ceder el paso.', t: 'Izquierda en rojo: solo de sentido único a sentido único.' },
    { c: 'pri', q: 'Un autobús escolar se detiene con las luces rojas intermitentes en una calle de doble sentido sin separación. Circulas en sentido contrario. ¿Qué haces?', o: ['Sigo, porque voy en el otro sentido', 'Me detengo y espero hasta que las luces se apaguen', 'Paso despacio a 15 mph', 'Toco la bocina y paso'], a: 1, e: 'Con luces rojas intermitentes debes detenerte en ambos sentidos hasta que se apaguen. Solo quienes circulan en sentido contrario por una autopista dividida o separada por barrera física no tienen que detenerse.', t: 'Bus escolar en rojo: alto en ambos sentidos.' },
    { c: 'seg', q: '¿Cuál es el límite legal de alcohol en sangre (BAC) para un conductor de 21 años o más?', o: ['0,05 %', '0,08 %', '0,10 %', '0,04 %'], a: 1, e: 'Para conductores de 21 años o más es 0,08 %. Para conductores comerciales es 0,04 % y para menores de 21, 0,01 %. Aun por debajo del límite te pueden detener si tu conducción se ve afectada.', t: '0,08 / 0,04 / 0,01.' },
    { c: 'seg', q: 'Un conductor de 19 años da 0,02 % de alcohol en sangre. ¿Infringe la ley?', o: ['No, está muy por debajo de 0,08 %', 'Sí: para menores de 21 el límite es 0,01 %', 'Solo si causó un accidente', 'No, si no conducía un vehículo comercial'], a: 1, e: 'California aplica una política de tolerancia cero a los menores de 21: el límite es 0,01 %. Además es ilegal que lleven alcohol en el vehículo salvo que vayan con un padre o tutor.', t: 'Menores de 21: 0,01 %.' },
    { c: 'lic', q: 'Un bordillo pintado de blanco significa:', o: ['Estacionamiento libre sin límite', 'Solo detenerse para subir o bajar pasajeros o correo', 'Solo vehículos de emergencia', 'Prohibido detenerse'], a: 1, e: 'Blanco: solo para subir o bajar pasajeros o depositar correo. Rojo: prohibido detenerse. Amarillo: carga y descarga. Verde: tiempo limitado. Azul: personas con discapacidad.', t: 'Rojo no, amarillo carga, blanco pasajeros, verde tiempo, azul discapacidad.' },
    { c: 'lic', q: '¿A qué distancia mínima de un hidrante puedes estacionar?', o: ['5 pies', '10 pies', '15 pies', '30 pies'], a: 2, e: 'No puedes estacionar a menos de 15 pies (unos 4,5 m) de un hidrante. Los bomberos necesitan espacio para conectar las mangueras.', t: 'Hidrante: 15 pies.' },
    { c: 'con', q: '¿Cuándo debes cambiar a luces bajas?', o: ['A 200 pies de un vehículo que viene de frente', 'A 500 pies de un vehículo que viene de frente y a 300 pies de uno al que sigues', 'Solo en ciudad', 'Cuando el otro conductor te hace cambio de luces'], a: 1, e: 'Debes bajar las luces cuando estás a 500 pies (≈150 m) de un vehículo que viene de frente y a 300 pies (≈90 m) de uno al que sigues. También usa luces cuando necesitas los limpiaparabrisas de forma continua.', t: '500 de frente, 300 detrás.' },
    { c: 'pri', q: 'En un cruce con STOP en las cuatro esquinas (4-way stop), dos vehículos se detienen al mismo tiempo. ¿Quién avanza primero?', o: ['El de la izquierda', 'El de la derecha', 'El más grande', 'El que va a girar'], a: 1, e: 'En un 4-way stop avanza primero quien se detuvo primero. Si se detienen a la vez, cede el paso el que tiene al otro a su derecha, es decir, pasa el de la derecha.', t: '4-way: primero en parar, primero en pasar; empate, la derecha.' },
    { c: 'con', q: 'En la autopista ves una patrulla detenida en el arcén con luces encendidas. ¿Qué exige la “Move Over Law”?', o: ['Nada especial', 'Cambiar a un carril no adyacente si es seguro o, si no puedes, reducir la velocidad', 'Detenerte detrás de la patrulla', 'Encender las luces de emergencia y seguir igual'], a: 1, e: 'Ante vehículos de emergencia, grúas o vehículos de mantenimiento detenidos con luces encendidas, debes cambiarte de carril para dejarles un carril libre o, si no es posible, reducir la velocidad.', t: 'Move over o slow down.' },
    { c: 'pri', q: 'Un conductor saca el brazo izquierdo doblado hacia arriba. ¿Qué indica?', o: ['Que va a girar a la izquierda', 'Que va a girar a la derecha', 'Que va a detenerse', 'Que puedes adelantar'], a: 1, e: 'Brazo extendido recto: giro a la izquierda. Brazo doblado hacia arriba: giro a la derecha. Brazo doblado hacia abajo: va a detenerse o reducir.', t: 'Recto izquierda, arriba derecha, abajo alto.' },
    { c: 'pri', q: '¿Puedes cruzar una doble línea amarilla continua?', o: ['Nunca', 'Solo para girar a la izquierda hacia una entrada privada o una intersección', 'Para adelantar si no viene nadie', 'Solo de noche'], a: 1, e: 'No puedes cruzarla para adelantar, pero sí para girar a la izquierda hacia una entrada de garaje, una intersección o para hacer un giro en U permitido. Dos dobles líneas amarillas separadas 2 pies o más son una barrera que nunca se cruza.', t: 'Doble amarilla: no para adelantar; sí para girar.' },
    { c: 'pri', q: 'Hay dos pares de líneas amarillas dobles separados por 2 pies o más. ¿Qué significa?', o: ['Carril de giro a la izquierda', 'Una barrera que no debes cruzar por ningún motivo', 'Carril para adelantar', 'Carril para bicicletas'], a: 1, e: 'Dos dobles líneas amarillas separadas 2 pies (unos 60 cm) o más funcionan como una barrera física. No puedes cruzarlas ni para girar ni para hacer un giro en U.', t: 'Doble-doble amarilla = muro.' },
    { c: 'pri', q: '¿Cuánto puedes circular dentro del carril central de giro a la izquierda?', o: ['Hasta 100 pies', 'Hasta 200 pies', 'Hasta 500 pies', 'Sin límite'], a: 1, e: 'El carril central de doble sentido sirve para preparar un giro a la izquierda o incorporarte desde una entrada. No puedes recorrer más de 200 pies (≈60 m) dentro de él ni usarlo para adelantar.', t: 'Carril central: 200 pies como máximo.' },
    { c: 'con', q: 'En una carretera de dos carriles donde no es seguro adelantar, llevas detrás una fila de vehículos. ¿Cuándo debes usar un apartadero (turnout)?', o: ['Si llevas 3 vehículos detrás', 'Si llevas 5 o más vehículos detrás', 'Solo si te lo pide la policía', 'Nunca, es opcional'], a: 1, e: 'Si conduces lento y llevas 5 o más vehículos detrás, debes usar el apartadero o la zona de adelantamiento más próxima para dejarlos pasar.', t: '5 detrás = usa el turnout.' },
    { c: 'pri', q: '¿Qué separación mínima debes dejar al adelantar a un ciclista?', o: ['1 pie', '2 pies', '3 pies', '6 pies'], a: 2, e: 'La ley californiana exige al menos 3 pies (unos 90 cm). Si no puedes dejar esa distancia, reduce y espera a poder adelantar con seguridad.', t: 'Ciclista: 3 pies.' },
    { c: 'seg', q: 'Un niño de 6 años y 1,15 m viaja en tu auto. ¿Qué exige la ley de California?', o: ['Cinturón de adulto en cualquier asiento', 'Silla o elevador adecuado en el asiento trasero', 'Puede ir delante con cinturón', 'Nada especial'], a: 1, e: 'Los menores de 8 años deben viajar en una silla o un elevador en el asiento trasero. Los menores de 2 años, a contramarcha salvo que pesen 40 libras o midan 40 pulgadas o más.', t: 'Menores de 8: sistema infantil atrás.' },
    { c: 'seg', q: 'Tienes 17 años y una licencia provisional. ¿Puedes hablar por teléfono con manos libres mientras conduces?', o: ['Sí, con manos libres está permitido', 'No: los menores de 18 no pueden usar el teléfono al conducir, ni con manos libres', 'Solo en autopista', 'Solo para llamar a tus padres'], a: 1, e: 'Los conductores menores de 18 no pueden usar el teléfono ni dispositivos electrónicos al conducir, ni siquiera con manos libres, salvo para emergencias. Los adultos pueden usar manos libres o un dispositivo montado con un solo toque.', t: 'Menor de 18: ni manos libres.' },
    { c: 'con', q: 'Estacionas cuesta abajo junto a un bordillo. ¿Hacia dónde giras las ruedas delanteras?', o: ['Hacia la calle', 'Hacia el bordillo', 'Rectas', 'Da igual con freno de mano'], a: 1, e: 'Cuesta abajo, gira las ruedas hacia el bordillo. Cuesta arriba con bordillo, gíralas hacia la calle, para que la rueda se apoye en el bordillo si el auto retrocede. Sin bordillo, siempre hacia el arcén.', t: 'Abajo hacia el bordillo; arriba hacia la calle.' },
    { c: 'con', q: 'Si debes detenerte en un paso a nivel, ¿dónde lo haces?', o: ['Justo encima de la primera vía', 'Entre 15 y 50 pies de la vía más cercana', 'A 5 pies de la vía', 'A más de 100 pies'], a: 1, e: 'Debes detenerte entre 15 y 50 pies (≈4,5 a 15 m) de la vía más cercana cuando hay señales de tren, barreras o un tren a la vista. Nunca te detengas sobre las vías.', t: 'Tren: entre 15 y 50 pies.' },
    { c: 'pri', q: 'Al entrar a una rotonda en EE. UU., ¿en qué sentido circulas y a quién cedes el paso?', o: ['Sentido horario; cedes a quien entra', 'Sentido antihorario; cedes a quien ya circula dentro', 'Cualquier sentido; no cedes', 'Sentido antihorario; tienes preferencia al entrar'], a: 1, e: 'Se circula en sentido antihorario, manteniendo la isleta central a tu izquierda, y se cede el paso a quienes ya están dentro. También a los peatones en los cruces de entrada y salida.', t: 'Antihorario y cede a quien está dentro.' },
    { c: 'sen', s: 'schoolUS', q: '¿Qué indica una señal con forma de pentágono?', o: ['Zona de obras', 'Escuela o cruce escolar', 'Paso a nivel', 'Zona de recreo para adultos'], a: 1, e: 'El pentágono (en amarillo verdoso fluorescente) es exclusivo de zonas escolares y cruces escolares. Con niños presentes, el límite suele ser 25 mph.', t: 'Pentágono = escuela.' },
    { c: 'sen', s: 'crossbuck', q: 'La cruz “RAILROAD CROSSING” equivale a:', o: ['Un STOP obligatorio siempre', 'Un YIELD: cede el paso al tren y detente si se acerca', 'Prohibido cruzar', 'Una sugerencia sin valor legal'], a: 1, e: 'La cruz de paso a nivel funciona como un ceda el paso: miras, escuchas y cedes al tren. Si se acerca un tren o hay luces o barreras activas, debes detenerte.', t: 'Crossbuck = YIELD al tren.' },
    { c: 'sen', s: 'doNotEnter', q: 'Al salir de una autopista ves esta señal de frente. ¿Qué haces?', o: ['Sigo con precaución', 'No entro: estaría entrando en sentido contrario', 'Entro si no hay tráfico', 'Toco la bocina'], a: 1, e: 'DO NOT ENTER marca la entrada prohibida, normalmente una rampa de salida o una calle de sentido contrario. Si sigues, encontrarás WRONG WAY. Detente y busca la entrada correcta.', t: 'DO NOT ENTER de frente = vas en contramano.' }
  ]
});
</script>
<script>
window.ADM.REGIONS.push({
  id: 'eu', name: 'Europa', code: 'EU', country: 'España (DGT) y Convenio de Viena',
